name: Publish package

# Builds and publishes GenX-DOS as GitHub Packages:
#   - a container image to ghcr.io (the whole site served by nginx)
#   - an npm package (@retro-jack/genx-dos) to the GitHub npm registry
# Runs automatically when a GitHub Release is published, and can be kicked
# off manually from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name + version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker-container driver is required for manifest annotations to be
      # written to the pushed image (the default driver drops them).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Keep a single image manifest (no attestation manifest list) so the
          # description annotation lands where GitHub reads it.
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # GitHub shows the package-listing description from the manifest
          # annotation (a Docker LABEL alone doesn't drive it). Single-platform
          # export only supports manifest-level annotations.
          annotations: |
            org.opencontainers.image.description=GenX-DOS v${{ steps.meta.outputs.version }} — container image: the full GenX-DOS static site (browser DOS-prompt terminal + 8-bit emulator suite) served by nginx.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Publish if this version isn't already on the registry
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$ver already published — skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
