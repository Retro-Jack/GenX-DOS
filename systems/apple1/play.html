<style>
  /* CRT bezel — the Apple 1 in its wooden case with integrated keyboard
     (Apple1.png, 1249x1088, screen hole keyed transparent at left 24.42%
     top 6.07% width 51.32% height 43.84%; the hole is 1.344 wide-to-tall,
     near enough 4:3 for the 40x24 display). A system portrait rather than a
     monitor shot, as the Amstrad CPC already is. apple1js's chrome (title,
     tape player, soft keyboard, modals) is hidden and its wrapper carries
     .bezel-wrap — the same sizing mechanism every other bundle uses — with
     the text canvas in the screen hole behind Apple1.png on the wallpaper. */
  html, body { background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; }
  h1, h2, .inset, .modal, #keyboard { display: none !important; }
  td > div:not(.overscan) { display: none !important; }
  /* apple1js's wrapper now carries .bezel-wrap and has had its inline
     width/margin removed, so this is the ordinary bezel rule the other
     bundles use rather than a selector hunting for a style attribute. That
     also retires the old body > div[style] match, which caught the shared
     audio banner as well and gave it the bezel's aspect-ratio. */
  .bezel-wrap {
    display: block;
    position: relative;
    width: min(100vw, calc(95dvh * 1249 / 1088));
    aspect-ratio: 1249 / 1088;
    margin: 0;
  }
  #display, #display tbody, #display tr, #display td { display: contents; }
  .screen-bg { position: absolute; left: 23.56%; top: 5.03%; width: 53.04%; height: 45.92%; background: #000; z-index: 1; }
  /* Clip box reaches the OUTER edge of the cutout's 2px feather
     (302,63..948,545 measured from the PNG's alpha), not its inner edge:
     clipped inside the ramp, the part-transparent ink has only .screen-bg
     behind it and shows as a fringe the moment that backing is not black.
     margin:0 stays for the same reason as the Apple ][ page. */
  .overscan { position: absolute; left: 24.179%; top: 5.79%; width: 51.801%; height: 44.393%; padding: 0; margin: 0; border: 0; overflow: hidden; z-index: 2; }
  #text { position: static; width: 100% !important; height: 100% !important; image-rendering: pixelated; transform: scale(0.855); }
  .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
</style>

<meta property="og:title" content="Apple 1js" />
<meta property="og:type" content="website" />
<meta property="og:description" content="Apple 1js is an Apple 1 emulator written using only JavaScript and HTML5." />
<meta property="og:url" content="https://www.scullinsteel.com/apple1/" />
<meta property="og:image" content="https://www.scullinsteel.com/apple1/img/image.png" />

<!-- Tapes -->
<script type="text/javascript">
var tapes = {};
</script>
<script type="text/javascript" src="tapes/apple30th.js"></script>
<script type="text/javascript" src="tapes/applesoft.js"></script>
<script type="text/javascript" src="tapes/basic.js"></script>
<script type="text/javascript" src="tapes/bezelcard.js"></script>
<script type="text/javascript" src="tapes/blackjack.js"></script>
<script type="text/javascript" src="tapes/checkers.js"></script>
<script type="text/javascript" src="tapes/hamurabi.js"></script>
<script type="text/javascript" src="tapes/life.js"></script>
<script type="text/javascript" src="tapes/lunar_lander.js"></script>
<script type="text/javascript" src="tapes/monitor.js"></script>
<script type="text/javascript" src="tapes/microchess.js"></script>
<script type="text/javascript" src="tapes/puzz15.js"></script>
<script type="text/javascript" src="tapes/startrek.js"></script>
<script type="text/javascript" src="tapes/volksforth.js"></script>
<script type="text/javascript" src="tapes/wumpus2.js"></script>

<!-- Web FE -->
</head>
<body ondragover="Apple1.handleDragOver(event)"
      ondrop="Apple1.handleDrop(event)"
      ondragend="Apple1.handleDragEnd(event)">
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <h1 style="font-size: 24px" class="motter">Apple 1js</h1>
    <h2 id="subtitle">An Apple 1 Emulator in JavaScript</h2>
    <table id="display">
      <tr>
        <td style="vertical-align: top">
          <div role="textbox" class="overscan"
               onkeydown="_keydown(event);"
               onkeyup="_keyup(event);">
            <canvas id="text" width="560" height="384"></canvas>
          </div>
          <div style="color: #75d475; position: absolute; font-size: 10px">Type E000R for BASIC</div>
        </td>
      </tr>
    </table>
    <div class="inset">
      <div id="khz" onclick="Apple1.toggleFPS()">0KHz</div>
      <button onclick="Apple1.pauseRun(this)">Pause</button>
      <button onclick="Apple1.openLoadText(event)">Load</button>
      <div id="player">
        <div id="tape"></div>
      </div>
      <div style="float: right">
        <button onclick="window.open('https://github.com/whscullin/apple1js','_html')"
                name="About">About</button>
        <button type="button" onclick="Apple1.openOptions()"
                name="Options">Options</button>
      </div>
    </div>
    <div class="inset">
      <div style="margin: 0px 0px">
        <div id="keyboard"></div>
      </div>
    </div>
    <img class="bezel-img" src="../_shared/bezels/Apple1.png" alt="">
  </div>
  <div class="modal" id="options-modal" aria-hidden="true">
    <div class="modal__overlay" tabindex="-1" data-micromodal-close>
      <div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="Options">
        <header class="modal__header">
          <span class="modal__title" id="options-modal-title">
            Options
          </span>
          <button class="modal__close" aria-label="Close modal" data-micromodal-close>
          </button>
        </header>
        <main class="modal__content" id="options-modal-content">
          <h3>CPU</h3>
          <ul>
            <li>
              <input type="checkbox" checked="checked" id="speed_toggle"
                    onclick="Apple1.toggleSpeed()"/>
              <label for="speed_toggle">
                Regulate Speed
              </label>
            </li>
            </ul>
            <h3>Monitor</h3>
            <ul>
            <li>
              <input type="checkbox" id="green_screen"
                    onclick="Apple1.updateScreen()" />
                <label for="green_screen">
                  Green Screen
                </label>
            </li>
            <li>
              <input type="checkbox" id="show_scanlines"
                    onclick="Apple1.updateScreen()" />
              <label for="show_scanlines">
                Show Scanlines
              </label>
            </li>
          </ul>
          <h3>I/O</h3>
          <ul>
            <li>
                <input type="checkbox" id="turbo_tape" checked="checked"
                    onclick="Apple1.setTurboTape(this.checked)" />
                <label for="turbo_tape">
                Turbo Tape Loading
                </label>
            </li>
          </ul>
        </main>
        <footer class="modal__footer">
          <button class="modal__btn" data-micromodal-close aria-label="Close this dialog window">Close</button>
        </footer>
      </div>
    </div>
  </div>

  <div class="modal" id="input-modal" aria-hidden="true">
    <div class="modal__overlay" tabindex="-1" data-micromodal-close>
      <div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="Input Text">
        <header class="modal__header">
          <span class="modal__title" id="input-modal-title">
            Input Text
          </span>
          <button class="modal__close" aria-label="Close modal" data-micromodal-close>
          </button>
        </header>
        <main class="modal__content" id="input-modal-content">
          <form action="#">
            <div class="controls">
              <select id="tape_select">
                <option>Or Select Tape...</option>
              </select>
              <button onclick="document.querySelector('#text_input').value = ''"
                    name="Clear">Clear</button>
              </div>
            <textarea id="text_input" rows="24" cols="80"></textarea>
          </form>
        </main>
        <footer class="modal__footer">
            <button class="modal__btn" aria-label="Send text to the keyboard" onclick="Apple1.doLoadText()">OK</button>
            <button class="modal__btn" data-micromodal-close aria-label="Close this dialog window">Close</button>
        </footer>
      </div>
    </div>
  </div>

  <div class="modal" id="local-modal" aria-hidden="true">
    <div class="modal__overlay" tabindex="-1" data-micromodal-close>
      <div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="Load Local File">
        <header class="modal__header">
          <span class="modal__title" id="local-modal-title">
              Load Local File
          </span>
          <button class="modal__close" aria-label="Close modal" data-micromodal-close>
          </button>
        </header>
        <main class="modal__content" id="input-modal-content">
          <form action="#">
            <input type="file" id="local_file" />
          </form>
        </main>
        <footer class="modal__footer">
            <button class="modal__btn" aria-label="Load local file" onclick="Apple1.doLoadLocal()">OK</button>
            <button class="modal__btn" data-micromodal-close aria-label="Close this dialog window">Close</button>
        </footer>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="apple1.js"></script>
  <script>
  document.getElementById('text').focus();
  (function() {
    var t = new URLSearchParams(location.search).get('tape');
    if (!t) return;
    var map = {
      startrek: 'Star Trek',
      blackjack: 'Blackjack',
      chess: 'Microchess',
      hamurabi: 'Hamurabi',
      lunar: 'Lunar Lander',
      wumpus: 'Wumpus',
      checkers: 'Checkers',
      puzzle15: '15 Puzzle',
      life: 'Life',
      apple30: 'Apple 30th',
      bezelcard: 'Bezel test card'
    };
    var name = map[t] || t;
    setTimeout(function() {
      var sel = document.querySelector('#tape_select');
      sel.value = name;
      sel.dispatchEvent(new Event('change'));
    }, 500);
  })();
  </script>
</body>
</html>
