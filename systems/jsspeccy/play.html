  <title>Sinclair ZX Spectrum</title>
  <style>
    /* CRT bezel — vintage TV (Sinclair.png, 1362x914, screen keyed to a
       transparent 4:3 hole at left 8.08% top 12.14% width 65.35% height
       73.96%). Shared with the ZX81 (jtyone) bundle — the Spectrum/ZX81 ran
       on a TV; the set floats on the 70s wallpaper. JSSpeccy (uiEnabled:false)
       renders a fixed-zoom canvas into #jsspeccy; we put #jsspeccy in the hole
       and stretch its canvas to fill. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat !important; background-size: 220px !important; overflow: hidden; color: #fff; font-family: monospace; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap { position: relative; width: min(100vw, calc((100dvh - 120px) * 1362 / 914)); aspect-ratio: 1362 / 914; }
    .screen-bg { position: absolute; left: 6.6%; top: 10.6%; width: 68.4%; height: 77.0%; background: #000; z-index: 1; }
    #jsspeccy { position: absolute; left: 8.08%; top: 12.14%; width: 65.35%; height: 73.96%; overflow: visible; z-index: 2; }
    /* JSSpeccy (uiEnabled:false) injects its own appContainer div with a fixed
       inline width of 320*zoom px. Left alone it pins the whole stack to that
       pixel width so the canvas can't follow the percentage-sized hole — the
       screen stops tracking the window. Force the injected div to fill the hole
       so the canvas scales with the bezel like jtyone's bare canvas does. */
    #jsspeccy > div { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; }
    #jsspeccy canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; transform: scale(1.09); }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
    .err { padding: 20px; }
  </style>
  <script>
    // JSSpeccy creates its AudioContext internally with no public handle and
    // no resume-on-gesture of its own, so a page opened without user
    // activation (direct URL rather than the prompt's window.open) stays
    // silent. Capture every context the engine creates and resume suspended
    // ones — best-effort on load for the activation piggyback, then on every
    // real user gesture (resume() is idempotent, so the listeners stay on).
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Patched(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Patched.prototype = Orig.prototype;
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;
      function unlock() {
        ctxs.forEach(function (c) {
          if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
        });
      }
      document.addEventListener('DOMContentLoaded', function () {
        [0, 100, 500, 1000, 2000].forEach(function (t) { setTimeout(unlock, t); });
      });
      ['keydown', 'pointerdown', 'touchstart'].forEach(function (ev) {
        document.addEventListener(ev, unlock);
      });
    })();
  </script>
  <script src="jsspeccy/jsspeccy.js"></script>

<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>

  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="jsspeccy"></div>
    <img class="bezel-img" src="../_shared/bezels/Sinclair.png" alt="">
  </div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const key = params.get('game');
      const opts = { zoom: 2, sandbox: false, uiEnabled: false, machine: 48 };
      if (key) {
        let games;
        try {
          games = await (await fetch('games.json')).json();
        } catch (e) {
          const d = document.createElement('div');
          d.className = 'err';
          d.textContent = 'Failed to load games.json: ' + e.message;
          document.body.replaceChildren(d);
          return;
        }
        const game = games[key];
        if (!game) {
          const d = document.createElement('div');
          d.className = 'err';
          d.textContent = 'Unknown game key: ' + key;
          document.body.replaceChildren(d);
          return;
        }
        document.title = 'Sinclair ZX Spectrum';
        opts.openUrl = game.rom;
        opts.autoStart = true;
        opts.autoLoadTapes = true;
      } else {
        document.title = 'Sinclair ZX Spectrum';
      }
      window.emu = JSSpeccy(document.getElementById('jsspeccy'), opts);
    })();
  </script>
  <script>
    // USB gamepad → keyboard maps, one per game (each game has its own keys).
    // JSSpeccy reads e.keyCode with an e.key fallback — the fallback is what
    // resolves Chuckie Egg's , and . (Symbol Shift combos on real hardware).
    (function () {
      var K = {
        Q: { key: 'q', code: 'KeyQ', keyCode: 81 },
        W: { key: 'w', code: 'KeyW', keyCode: 87 },
        E: { key: 'e', code: 'KeyE', keyCode: 69 },
        R: { key: 'r', code: 'KeyR', keyCode: 82 },
        T: { key: 't', code: 'KeyT', keyCode: 84 },
        A: { key: 'a', code: 'KeyA', keyCode: 65 },
        S: { key: 's', code: 'KeyS', keyCode: 83 },
        F: { key: 'f', code: 'KeyF', keyCode: 70 },
        H: { key: 'h', code: 'KeyH', keyCode: 72 },
        J: { key: 'j', code: 'KeyJ', keyCode: 74 },
        O: { key: 'o', code: 'KeyO', keyCode: 79 },
        P: { key: 'p', code: 'KeyP', keyCode: 80 },
        Z: { key: 'z', code: 'KeyZ', keyCode: 90 },
        X: { key: 'x', code: 'KeyX', keyCode: 88 },
        K: { key: 'k', code: 'KeyK', keyCode: 75 },
        one:    { key: '1', code: 'Digit1', keyCode: 49 },
        two:    { key: '2', code: 'Digit2', keyCode: 50 },
        nine:   { key: '9', code: 'Digit9', keyCode: 57 },
        zero:   { key: '0', code: 'Digit0', keyCode: 48 },
        comma:  { key: ',', code: 'Comma',  keyCode: 188 },
        period: { key: '.', code: 'Period', keyCode: 190 },
        space:  { key: ' ', code: 'Space',  keyCode: 32 },
        enter:  { key: 'Enter', code: 'Enter', keyCode: 13 }
      };
      var qwre = { left: K.Q, right: K.W, up: K.R, down: K.E };
      var pads = {
        // Face buttons 0=A 1=B 2=X 3=Y. The pad is gameplay only — no Start
        // button is mapped (use the keyboard for a game's title/start).
        manicmn:  { axes: { left: K.Q, right: K.W },
                    buttons: { 0: K.space, 1: K.space, 2: K.space, 3: K.space } },
        jetwilly: { axes: { left: K.Q, right: K.W },
                    buttons: { 0: K.space, 1: K.space, 2: K.space, 3: K.space } },
        // Chuckie Egg's real defaults (established in-game, key by key):
        // 9 left, 0 right, 2 up, W down, Z or M jumps — nothing else does,
        // Space included. The old gamedoc's ,/./A/Z were wrong; . "worked"
        // only because it synthesizes Symbol Shift+M and M jumps.
        chuckegg: { axes: { left: K.nine, right: K.zero, up: K.two, down: K.W },
                    buttons: { 0: K.Z, 1: K.Z, 2: K.Z, 3: K.Z } },
        // Pad-verified: E is up, R is down — the reverse of Atic Atac's
        // layout (the old gamedoc had them swapped).
        sabrwulf: { axes: { left: K.Q, right: K.W, up: K.E, down: K.R },
                    buttons: { 0: K.T, 1: K.T, 2: K.T, 3: K.T } },
        kngtlore: { axes: { left: K.Z, right: K.X, up: K.A },
                    buttons: { 0: K.Q, 1: K.one } },
        atatac:   { axes: qwre,
                    buttons: { 0: K.T, 1: K.Z } },
        // Pad-verified: R is up, E is down (the old gamedoc had them
        // swapped), so Pssst uses the same Q/W/R/E layout as its Ultimate
        // stablemates after all.
        pssst:    { axes: qwre,
                    buttons: { 0: K.T, 1: K.T, 2: K.T, 3: K.T } },
        // Keys verified against the game's own instructions: T fire,
        // B/N/M/SS/Space pick up-drop, CS/Z/X/C/V drop from rope, Enter
        // pause. Sabreman starts unarmed — weapons are pickups.
        uwurlde:  { axes: qwre,
                    buttons: { 0: K.T, 1: K.space, 2: K.Z, 3: K.T } },
        dizzy:    { axes: { left: K.Z, right: K.X },
                    buttons: { 0: K.space, 1: K.enter } },
        skooldzd: { axes: { left: K.O, right: K.P, up: K.Q, down: K.A },
                    buttons: { 0: K.J, 1: K.H, 2: K.F, 3: K.S, 4: K.W } }
      };
      var g = new URLSearchParams(location.search).get('game');
      if (g && pads[g]) {
        window.GenXGamepadMap = pads[g];
        // JSSpeccy rebinds its key listeners from document onto the
        // focusable app-container div it injects (setKeyboardEventRoot), so
        // synthetic events must be dispatched at that div — events fired at
        // document never reach a descendant's listeners. The div only
        // exists once the engine has booted, hence the lazy lookup.
        window.GenXGamepadMap.target = function () {
          return document.querySelector('#jsspeccy > div');
        };
      }
    })();
  </script>
