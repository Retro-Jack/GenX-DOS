<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odyssey²</title>
  <style>
    #game { aspect-ratio: 4 / 3; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); position: relative; }
    #canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000; }
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-family: monospace; pointer-events: none; }
  </style>
  <link rel="stylesheet" href="../_shared/genx-frame.css">
  <link rel="stylesheet" href="../_shared/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/genx-controls-link.css">
  <script defer src="../_shared/genx-controls-link.js"></script>
  <script src="../_shared/genx-game-loader.js"></script>
  <link rel="preload" href="o2em.wasm" as="fetch" crossorigin>
  <link rel="preload" href="o2rom.bin" as="fetch" crossorigin>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div id="game">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="loading" class="loading">Booting Odyssey²…</div>
  </div>
  <script>
    // Magnavox Odyssey² — libretro o2em core statically linked into a
    // small emscripten/SDL2 frontend (see systems/odyssey2/frontend.c).
    // BIOS and game ROM are written into MEMFS via Module.preRun before
    // main() runs; the frontend opens them as /o2rom.bin and /game.bin.
    (async () => {
      const _gx = await window.genxLoadGame('#loading');
      if (!_gx) return;
      const { game, fail } = _gx;

      let biosBytes, romBytes;
      try {
        [biosBytes, romBytes] = (await Promise.all([
          fetch('o2rom.bin').then(r => r.arrayBuffer()),
          fetch(game.rom).then(r => r.arrayBuffer()),
        ])).map(b => new Uint8Array(b));
      } catch (e) { fail('Failed to fetch BIOS/ROM: ' + e.message); return; }

      const canvas = document.getElementById('canvas');
      // MODULARIZE'd build hands the Module instance to each preRun
      // callback as the first argument; `this` is unreliable in this mode.
      const Module = {
        canvas,
        print:    (s) => console.log('[o2em]', s),
        printErr: (s) => console.error('[o2em]', s),
        preRun: [function (mod) {
          mod.FS.writeFile('/o2rom.bin', biosBytes);
          mod.FS.writeFile('/game.bin', romBytes);
        }],
        onAbort: (e) => fail('Emulator aborted: ' + e),
      };

      const s = document.createElement('script');
      s.src = 'o2em.js';
      s.onload = () => {
        document.getElementById('loading')?.remove();
        canvas.focus();
        createO2EM(Module);
      };
      s.onerror = () => fail('Failed to load o2em.js');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
