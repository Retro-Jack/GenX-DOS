<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">

  <title>Magnavox Odyssey²</title>
  <style>
    /* CRT bezel — wood-cabinet console TV (70s.png, 1240x855), shared with the
       Atari 2600, ColecoVision and Intellivision. o2em's #canvas fills #game,
       so #game is pinned into the screen hole (grown 2px vertically to meet the
       glass); .screen-bg (black, ~2% larger) hides the cutout's AA edge; 70s.png
       on top. !important on the wallpaper because genx-frame.css loads AFTER this
       <style> and resets body to black. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat !important; background-size: 220px !important; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap { position: relative; width: min(100vw, calc((100dvh - 120px) * 1240 / 855)); aspect-ratio: 1240 / 855; }
    .screen-bg { position: absolute; left: 25.6%; top: 11.1%; width: 49.4%; height: 55.6%; background: #000; z-index: 1; }
    #game { position: absolute; left: 27.6%; top: calc(13.1% - 1px); width: 45.4%; height: calc(51.6% + 2px); overflow: hidden; z-index: 2; }
    #canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; background: #000; }
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-family: monospace; pointer-events: none; }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
  </style>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/styles/genx-savestate.css">
  <script defer src="../_shared/genx-savestate-std.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>
  <script src="../_shared/genx-game-loader.js"></script>
  <link rel="preload" href="o2em.wasm" as="fetch" crossorigin>
  <link rel="preload" href="o2rom.bin" as="fetch" crossorigin>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="game">
      <canvas id="canvas" tabindex="0"></canvas>
      <div id="loading" class="loading">Booting Odyssey²…</div>
    </div>
    <img class="bezel-img" src="../_shared/bezels/70s.png" alt="">
  </div>
  <script>
    // Magnavox Odyssey² — libretro o2em core statically linked into a
    // small emscripten/SDL2 frontend (see systems/odyssey2/frontend.c).
    // BIOS and game ROM are written into MEMFS via Module.preRun before
    // main() runs; the frontend opens them as /o2rom.bin and /game.bin.
    (async () => {
      const _gx = await window.genxLoadGame('#loading');
      if (!_gx) return;
      const { game, fail } = _gx;

      let biosBytes, romBytes;
      try {
        [biosBytes, romBytes] = (await Promise.all([
          fetch('o2rom.bin').then(r => r.arrayBuffer()),
          fetch(game.rom).then(r => r.arrayBuffer()),
        ])).map(b => new Uint8Array(b));
      } catch (e) { fail('Failed to fetch BIOS/ROM: ' + e.message); return; }

      const canvas = document.getElementById('canvas');
      // MODULARIZE'd build hands the Module instance to each preRun
      // callback as the first argument; `this` is unreliable in this mode.
      const Module = {
        canvas,
        print:    (s) => console.log('[o2em]', s),
        printErr: (s) => console.error('[o2em]', s),
        preRun: [function (mod) {
          mod.FS.writeFile('/o2rom.bin', biosBytes);
          mod.FS.writeFile('/game.bin', romBytes);
        }],
        onAbort: (e) => fail('Emulator aborted: ' + e),
      };

      const s = document.createElement('script');
      s.src = 'o2em.js';
      s.onload = () => {
        document.getElementById('loading')?.remove();
        canvas.focus();
        createO2EM(Module).then((m) => {
          // Expose the instance for the save/load-state adapter below. o2em's
          // libretro core implements retro_serialize; frontend.c wraps it as
          // _gx_state_save/_size/_buffer/_load (see that file).
          window.GenXO2 = m;
          window.GenXStateAdapter = {
            ready: function () { return !!(m && m._gx_state_save && m.HEAPU8); },
            getState: function () {
              var ptr = m._gx_state_save();
              if (!ptr) return null;
              var sz = m._gx_state_size();
              if (!sz) return null;
              return m.HEAPU8.slice(ptr, ptr + sz); // copy out of the heap
            },
            setState: function (bytes) {
              var ptr = m._gx_state_buffer(bytes.length);
              if (!ptr) return;
              m.HEAPU8.set(bytes, ptr);
              m._gx_state_load(bytes.length);
            },
            refocus: function () { canvas.focus(); }
          };
        });
      };
      s.onerror = () => fail('Failed to load o2em.js');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
