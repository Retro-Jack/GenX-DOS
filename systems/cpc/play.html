<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <title>Amstrad CPC</title>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <style>
    /* CRT bezel — Amstrad CPC464 + CTM640 monitor (Amstrad.png, 1502x992,
       aspect 1.514). Three layers, back to front:
         1. .screen-bg — black backdrop behind the screen hole, a touch
            larger than the cutout so the wallpaper can't bleed through the
            PNG's anti-aliased hole edge.
         2. #canvas    — the tiny8bit CPC framebuffer, sized to the cutout.
         3. .bezel-img — Amstrad.png on top; its transparent hole reveals
            the canvas. Hole detected at left 27.03% top 12.90% w 42.01%
            h 47.38% (aspect 1.34 ≈ the CPC's 4:3); canvas inset ~1.5% per
            side so its edges tuck under the bezel lip.
       Bezel fills the full viewport height (100dvh). Wallpaper override must
       follow genx-frame.css (which sets body black). */
    html, body { background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; }
    .bezel-wrap {
      position: relative;
      width: min(100vw, calc(100dvh * 1502 / 992 * 1.05));
      aspect-ratio: 1502 / 992;
    }
    .screen-bg {
      position: absolute;
      left: 25.5%; top: 11.4%; width: 45%; height: 51%;
      background: #000;
      z-index: 1;
    }
    #canvas {
      position: absolute;
      left: 24.85%; top: 4.8%; width: 46.3%; height: 66.4%;
      image-rendering: pixelated; image-rendering: crisp-edges;
      background: #000;
      z-index: 2;
    }
    #loading {
      position: absolute;
      left: 24.85%; top: 4.8%; width: 46.3%; height: 66.4%;
      display: flex; align-items: center; justify-content: center;
      color: #888; font-family: monospace; pointer-events: none;
      z-index: 2;
    }
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
    }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <script src="../_shared/genx-game-loader.js"></script>
  <link rel="stylesheet" href="../_shared/styles/genx-savestate.css">
  <script defer src="../_shared/genx-savestate-std.js"></script>
  <script defer src="../_shared/genx-gamepad-keys.js"></script>
  <link rel="preload" href="cpc.wasm" as="fetch" crossorigin>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="loading">Booting Amstrad CPC…</div>
    <img class="bezel-img" src="../_shared/bezels/Amstrad.png" alt="">
  </div>

  <script>
    // Build the corner controls link synchronously. The ?game= param is
    // consumed by the sokol_args URL rewrite below, so the deferred shared
    // genx-controls-link.js races it and can lose the gamedoc target; the
    // shared script skips when a .gx-controls-link already exists. Same
    // pattern as the apple2 bundle.
    (function () {
      var key = new URLSearchParams(location.search).get('game');
      var a = document.createElement('a');
      a.href = key ? '../../docs/games/cpc/' + key + '.html' : 'controls.html';
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'gx-controls-link';
      a.innerHTML = 'controls<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1h5v5L8.86 3.85 4.7 8 4 7.3l4.15-4.16zM2 3h2v1H2v6h6V8h1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1"/></svg>';
      document.body.appendChild(a);
    })();

    // PageUp / PageDown → Fire button. floooh's chips library only wires
    // one fire button (BTN0 == BTN1, mapped to Space). We translate both
    // PageUp and PageDown events into synthetic Space events so either
    // key fires. Listener runs at capture phase before sokol's handler
    // sees the original PageUp/PageDown.
    function fireKeyRemap(e) {
      if (e.key === 'PageUp' || e.key === 'PageDown') {
        e.preventDefault();
        e.stopPropagation();
        document.dispatchEvent(new KeyboardEvent(e.type, {
          key: ' ', code: 'Space', keyCode: 32, which: 32,
          bubbles: true, cancelable: true
        }));
      }
    }
    document.addEventListener('keydown', fireKeyRemap, { capture: true });
    document.addEventListener('keyup',   fireKeyRemap, { capture: true });

    // USB gamepad → CPC joystick, via the shared shim. Games launched
    // with ?joystick=true route the synthesized arrows/Space to the
    // emulated 9-pin port. D-pad or left stick steers, any face button
    // fires. No ?game= means the plain BASIC prompt — leave the shim
    // dormant there so a pad can't type into BASIC.
    if (new URLSearchParams(location.search).get('game'))
      window.GenXGamepadMap = {
      axes: {
        left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  keyCode: 37 },
        right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 },
        up:    { key: 'ArrowUp',    code: 'ArrowUp',    keyCode: 38 },
        down:  { key: 'ArrowDown',  code: 'ArrowDown',  keyCode: 40 }
      },
      buttons: {
        0: { key: ' ', code: 'Space', keyCode: 32 },
        1: { key: ' ', code: 'Space', keyCode: 32 },
        2: { key: ' ', code: 'Space', keyCode: 32 },
        3: { key: ' ', code: 'Space', keyCode: 32 }
      }
    };

    // Audio auto-unlock: clears sokol's suspended-audio (muted-speaker)
    // icon on load instead of waiting for a click. sokol resumes its
    // AudioContext on input over the canvas; a burst of synthetic events
    // piggybacks on the user-activation the prompt's window.open() click
    // propagated into this tab. Same pattern as jsbeeb/Electron.
    function _gxUnlockAudio() {
      const c = document.getElementById('canvas');
      if (!c) return;
      ['pointerdown', 'mousedown', 'touchstart', 'mouseup'].forEach(function (t) {
        try { c.dispatchEvent(new Event(t, { bubbles: true })); } catch (e) {}
      });
    }
    document.addEventListener('DOMContentLoaded', function () {
      [0, 100, 500, 1000, 2000].forEach(function (t) { setTimeout(_gxUnlockAudio, t); });
    });

    (async function () {
      // No ?game= → boot to plain Locomotive BASIC (the CPC's ROM-BASIC
      // prompt on a real machine with no disk inserted). Skip games.json
      // and let cpc.js initialise with empty sokol_args.
      const hasGame = new URLSearchParams(location.search).has('game');
      let game = null;
      const fail = (msg) => {
        const d = document.createElement('div');
        d.className = 'err';
        d.textContent = msg;
        document.getElementById('loading').replaceChildren(d);
      };

      if (hasGame) {
        const _gx = await window.genxLoadGame('#loading');
        if (!_gx) return;
        game = _gx.game;
        // floooh's tiny8bit CPC reads its config from window.location.search
        // via sokol_args (sargs). Recognised keys (see chips-test cpc.c):
        //   file=<url>      — load this disk/snapshot/tape on boot
        //   type=cpc464     — pick a different model (default CPC 6128)
        //   input=<keys>    — type these keys after load
        //   joystick=...    — enable joystick
        // We rewrite location.search to ?file=<rom> so the WASM picks it
        // up at sargs_setup() time (before any C code runs).
        const newParams = new URLSearchParams();
        // Relative path — floooh's own tiny8bit demos use relative
        // filenames (?file=arkanoid.sna) and emscripten's fetch resolves
        // them against the document URL.
        newParams.set('file', game.rom);
        if (game.input) newParams.set('input', game.input);
        if (game.type)  newParams.set('type',  game.type);
        if (game.joystick) newParams.set('joystick', 'true');
        history.replaceState(null, '', '?' + newParams.toString());
        console.log('[GenX-DOS] CPC params:', '?' + newParams.toString());
      } else {
        document.title = 'Amstrad CPC';
        // Clear any stray search to keep sokol_args clean.
        history.replaceState(null, '', location.pathname);
      }

      // Minimal Module config — floooh's official harness style.
      window.Module = {
        canvas: document.getElementById('canvas'),
        print: (...a) => console.log(a.join(' ')),
        printErr: (...a) => console.warn(a.join(' ')),
        setStatus: () => {},
        monitorRunDependencies: () => {},
        onRuntimeInitialized: () => { document.getElementById('loading').style.display = 'none'; }
      };

      // Save / load state. Our locally-rebuilt cpc.wasm (see BUILDING-WASM.md)
      // exports gx_state_* wrappers around chips' cpc_save_snapshot /
      // cpc_load_snapshot. The snapshot is a self-contained cpc_t struct (no
      // emscripten_sleep), so unlike atari800 it's safe to call straight from a
      // button — no frame-loop deferral. JS moves the raw struct bytes through
      // a fixed static buffer (gx_state_ptr) via HEAPU8.
      window.GenXStateAdapter = {
        ready: function () {
          return !!(window.Module && Module.HEAPU8 && typeof Module._gx_state_save === 'function');
        },
        getState: function () {
          var n = Module._gx_state_save();
          var p = Module._gx_state_ptr();
          // Copy out of wasm memory so the slot can't alias the live buffer.
          return Module.HEAPU8.slice(p, p + n);
        },
        setState: function (bytes) {
          var n = Module._gx_state_size();
          var p = Module._gx_state_ptr();
          Module.HEAPU8.set(bytes.subarray(0, n), p);
          if (!Module._gx_state_load()) throw new Error('load failed');
        },
        refocus: function () { var c = document.getElementById('canvas'); if (c && c.focus) c.focus(); }
      };

      const s = document.createElement('script');
      s.src = 'cpc.js';
      s.async = true;
      s.onerror = () => fail('Failed to load cpc.js');
      document.body.appendChild(s);
    })();
  </script>

  <!-- Bezel: Amstrad CPC464 (CTM640 monitor) — photo by Bill Bertram
       (Wikimedia Commons, "Amstrad CPC464"), CC-BY-SA 2.5. Background
       alpha-keyed locally; this modified version is likewise CC-BY-SA 2.5. -->
</body>
</html>
