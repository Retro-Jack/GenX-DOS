<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commodore MAX</title>
  <link rel="stylesheet" href="../_shared/genx-frame.css">
  <link rel="stylesheet" href="../_shared/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/genx-controls-link.css">
  <style>
    /* CRT bezel — Commodore 1084S monitor (Commodore.png, 1223x1104, screen
       keyed to a transparent hole; the set floats on the 70s wallpaper).
       Shared by the whole VICE family (c64/c128/c16/plus4/vic20/max) — same
       monitor, same hole. EJS owns the canvas, so #game sits in the screen
       hole and EJS draws into it. Layers (back to front):
         1. .screen-bg — black backdrop, slightly larger than the hole (covers
            the cutout's anti-aliased edge so wallpaper can't bleed through).
         2. #game      — the EJS player at the measured hole.
         3. .bezel-img — Commodore.png on top; canvas shows through the hole.
       Screen hole (measured): left 12.3% top 12.5% width 76.0% height 63.9%.
       The wallpaper override must follow genx-frame.css (which sets body
       black); the VICE numlock/softkey banners are position:fixed, so the
       flex-centred bezel is unaffected. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap {
      position: relative;
      width: min(100vw, calc((100dvh - 120px) * 1223 / 1104));
      aspect-ratio: 1223 / 1104;
    }
    .screen-bg {
      position: absolute;
      left: 10.3%; top: 10.5%; width: 80.0%; height: 67.9%;
      background: #000;
      z-index: 1;
    }
    #game {
      position: absolute;
      left: 12.3%; top: 12.5%; width: 76.0%; height: 63.9%;
      overflow: hidden;
      z-index: 2;
    }
    /* EJS fits the canvas to #game preserving aspect; the hole is ~4:3 so the
       letterbox is tiny — stretch height only to close it. */
    #game canvas { height: 100% !important; transform: scale(1.01); }
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
    }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/genx-savestate.css">
  <script defer src="../_shared/genx-savestate.js"></script>
  <link rel="preload" href="../_shared-ejs/ejs/data/cores/vice_x64-legacy-wasm.data" as="fetch" crossorigin>
  <script defer src="../_shared/genx-numlock-warn.js"></script>
  <script defer src="../_shared/genx-vice-softkeys.js"></script>
  <script src="../_shared-ejs/genx-ejs-boot.js"></script>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="game"><div class="loading">Booting Commodore MAX…</div></div>
    <img class="bezel-img" src="../_shared/bezels/Commodore.png" alt="">
  </div>
  <script>
    // MAX Machine — VICE x64 core in Ultimax mode: 2 KB RAM, no built-in
    // BASIC, cart-only. Same VIC-II chipset as the C64 — that's why it
    // shares the x64 core file.
    genxBootEJS({
      title: 'Commodore MAX',
      coreName: 'vice_x64',
      defaultOptions: {
        'vice_c64_model': 'ultimax',
        'vice_drive_true_emulation': 'disabled',
        'vice_autoloadwarp': 'disabled',
        'keyboardInput': 'enabled',
        'altKeyboardInput': 'enabled',
        'vice_joyport_type': '1'
      }
    });
  </script>
</body>
</html>
