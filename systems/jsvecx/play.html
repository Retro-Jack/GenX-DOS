     Chrome will not hand a pad to this page even with the page focused —

<link rel="stylesheet" href="../_shared/styles/genx-frame.css">
<link rel="stylesheet" href="../_shared/styles/genx-noscript.css">

<style>
  html, body {
    background: #000 url('../_shared/textures/70s-bg.png') repeat;
    background-size: 220px;
  }

  /* Three-layer bezel order (back -> front):
     1. .screen-bg  — solid black backdrop slightly bigger than the picture
     2. #vecscr / #overlay — the vector canvas and the game's screen overlay
     3. .bezel-img  — Vectrex.png console photo on top, its cutout reveals both

     Vectrex.png is 1099x1399 and portrait — the machine is a console with the
     tube built in, so unlike the shared monitor bezels it is a photo of the
     whole unit floating on the wallpaper.

     The screen hole is a clean RECTANGLE, not a rounded aperture: measured
     across the blob, width holds at 646-647px over the full height and height
     at 804-811px over the full width. So there is no corner-clipping risk and
     no need for the inscribed-rectangle treatment the TRS-80 and Electron
     needed. These percentages ARE the measured feather bound — where the bezel
     stops being fully transparent. The old bundle sat about 0.2% inside it,
     which left a visible sliver of backdrop down the right-hand side under
     the magenta check.

     Note for anyone re-measuring: the usual transparent-pixel bounding box
     returns 100% x 100% here and is useless, because the console floats on a
     transparent surround. Flood-fill from the hole centre instead. */
  .bezel-wrap {
    position: relative;
    width: min(100vw, calc((100dvh - 40px) * 1099 / 1399));
    aspect-ratio: 1099 / 1399;
  }
  .screen-bg {
    position: absolute;
    left: 15.5%;
    top: 11%;
    width: 60.5%;
    height: 59.5%;
    background: #000;
    z-index: 1;
  }
  /* !important is load-bearing here, not cargo cult. The engine's resizer()
     runs on every resize and writes inline width/height/left/top on both the
     canvas and the overlay, sizing them to the whole viewport for its own
     full-screen layout. Inline styles beat ordinary rules, so without these
     the picture escapes the bezel entirely. Same situation as the apple1 and
     apple2 pages, which override their engine's stylesheet the same way. */
  #vecscr, #overlay {
    position: absolute;
    left: 16.29% !important;
    top: 11.72% !important;
    width: 58.96% !important;
    height: 58.04% !important;
    z-index: 2;
  }
  /* The overlay is the printed plastic screen cover each game shipped with —
     it belongs in front of the vectors, not behind them. */
  #overlay { z-index: 3; pointer-events: none; }
  .bezel-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 4;
  }

  /* The engine ships its own developer UI — ROM picker, sliders, memory
     monitor, credits. The elements must exist because the runtime writes to
     them unconditionally and throws if they are missing, but none of it
     belongs in front of a player. */
  #menu, #memMon, #notice, #instructions, #credits, #quicklink { display: none !important; }
</style>

  <script>
  /* Audio auto-unlock. The click that fired window.open from the prompt
     carries user-activation into this tab, but only briefly. Poll rather than
     fire a fixed burst: the engine builds its AudioContext lazily, so on a
     cold load there is nothing to resume yet and an early burst all misses —
     the same failure jsbeeb had. Stops as soon as the context reports
     running; gives up after 8s. Direct navigation, and Firefox in all cases,
     still need the user's own first click, which the shim below handles. */
  (function () {
    function ctx() { return (window.vecx && vecx.e8910 && vecx.e8910.ctx) || null; }
    function tick() {
      var c = ctx();
      if (c && c.state === 'running') return true;
      if (c) c.resume();
      document.documentElement.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      return false;
    }
    document.addEventListener('DOMContentLoaded', function () {
      var deadline = Date.now() + 8000;
      if (tick()) return;
      var t = setInterval(function () {
        if (tick() || Date.now() > deadline) clearInterval(t);
      }, 150);
    });
    document.addEventListener('mousedown', function () {
      var c = ctx();
      if (c && c.state !== 'running') c.resume();
    }, true);
  })();
  </script>
