    <title>Tandy TRS-80</title>
    <link rel="stylesheet" href="../_shared/styles/genx-frame.css" />
    <link rel="stylesheet" href="../_shared/styles/genx-noscript.css" />
    <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css" />
    <style>
      /* CRT bezel — Radio Shack TRS-80 Model III (TRS-80-Model-III.png, 1498x1089,
       aspect 1.376): the all-in-one case, screen top-left, twin Mini Disk
       drives beside it, keyboard and numeric keypad in front, on a
       keyed-transparent background. It replaces the Model I's three-box
       sprawl of monitor, expansion interface and drive stack.
       Three layers, back to front:
         1. .screen-bg — black backdrop. It covers the WHOLE cutout plus 1%
            proud on every side, not just the area the picture occupies: the
            picture is inset within the glass, and the rest of the glass has to
            read as an unlit CRT face rather than as wallpaper showing through.
            The 1% margin is what stops the wallpaper bleeding through the
            PNG's anti-aliased hole edge.
         2. #screen    — holds the emulator's <canvas>, sized to the cutout.
         3. .bezel-img — TRS-80-Model-III.png on top; its transparent screen hole reveals
            the canvas, and the CRT's rounded corners trim the canvas corners.
       Screen hole measured (alpha flood-fill): left 17.82% top 7.16%
       w 41.52% h 45.73%; the picture is inset 5% from that, centred on the
       same point, so a little of the CRT's black surround shows all round
       rather than the image running right to the edge of the glass. The sdltrs canvas is a clean 512x384 (4:3) text area
       — no phosphor padding to overscan-crop — so the canvas just fills the
       cutout. Wallpaper override must follow genx-frame.css (body black). */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000 url('../_shared/textures/70s-bg.png') repeat;
        background-size: 220px;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bezel-wrap {
        position: relative;
        height: 100vh;
        aspect-ratio: 1498 / 1089;
        max-width: 100vw;
      }
      .screen-bg {
        position: absolute;
        left: 16.82%;
        top: 6.16%;
        width: 43.52%;
        height: 47.73%;
        background: #000;
        z-index: 1;
      }
      #screen {
        position: absolute;
        left: 20.77%;
        /* Nudged DOWN relative to the cutout on purpose. The picture is
           512x384, but the games don't fill it evenly: Galaxy Invasion's
           dotted frame occupies y 8..335, leaving 8 pixels above it and 48
           below, so a canvas centred on the cutout puts the visible frame
           high in the tube. Offsetting by half that difference — 20 canvas
           px, about 1.9% of the bezel height — centres what you actually
           see rather than what the surface technically contains. */
        top: 12.32%;
        width: 35.6%;
        height: 39.21%;
        z-index: 2;
        overflow: hidden;
      }
      /* Backing store is pinned to sdltrs's native surface (1024x768, via the
       canvas width/height attrs) so the software SDL_UpdateWindowSurface
       putImageData lands at full size; CSS then scales the display to fill the
       cutout. Don't set width/height attrs to anything but the surface size or
       only the top-left corner draws. */
      /* image-rendering is set from JS — see the note by the canvas. The picture
       is rendered at the machine's own 512x384 and displayed at whatever the
       bezel cutout gives, so it can land either side of 1:1 and neither CSS
       value is right for both cases. */
      #screen canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
        outline: none;
        border: none;
      }
      #screen canvas:focus {
        outline: none;
      }
      .bezel-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 3;
      }
      .err {
        padding: 20px;
      }
    </style>
    <script defer src="../_shared/genx-controls-link.js"></script>
    <script defer src="../_shared/genx-repo-link.js"></script>
    <script defer src="../_shared/genx-softkey-policy.js"></script>
    <script defer src="../_shared/genx-trs80-softkeys.js"></script>
  </head>
  <body>
    <noscript
      ><div class="gx-noscript">
        <div class="gx-noscript-title">JavaScript Required</div>
        <div>This site is a client-side DOS terminal and emulator suite.</div>
        <div>It needs JavaScript to run.</div>
        <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
      </div></noscript
    >
    <div class="bezel-wrap">
      <div class="screen-bg"></div>
      <!-- 512x384 = the machine's own resolution, and exactly what sdltrs emits
         at -scale 1. The backing store MUST equal the SDL surface size: the
         software video path does a raw putImageData, and emscripten does not
         resize the canvas for it, so a mismatch draws only the top-left corner.

         It used to be 1024x768 (-scale 2), which meant the picture was always
         being scaled DOWN into the bezel cutout — and after the cutout was
         inset, down by two thirds, which turns a 12-pixel-tall character into
         mush whichever filtering you pick. Rendering at native resolution puts
         the ratio near 1:1, where text is legible. -->
      <div id="screen">
        <canvas
          id="screen-canvas"
          width="512"
          height="384"
          tabindex="0"
        ></canvas>
      </div>
      <img
        class="bezel-img"
        src="../_shared/bezels/TRS-80-Model-III.png"
        alt=""
      />
    </div>

    <!-- sdltrs.js defines the createSDLTRS() factory; it MUST load before the
       boot code below references it. -->
    <script src="sdltrs.js"></script>
    <script>
      (async function () {
        const fail = (msg) => {
          const d = document.createElement('div');
          d.className = 'err';
          d.textContent = msg;
          document.body.replaceChildren(d);
        };
        const canvas = document.getElementById('screen-canvas');
        const params = new URLSearchParams(location.search);
        const key = params.get('game');
        if (!key) {
          document.title = 'Tandy TRS-80';
          return;
        }

        let games;
        try {
          games = await (await fetch('games.json')).json();
        } catch (e) {
          fail('Failed to load games.json: ' + e.message);
          return;
        }
        const game = games[key];
        if (!game) {
          fail('Unknown game key: ' + key);
          return;
        }
        document.title = 'Tandy TRS-80';

        // An entry may carry a rom (a .cmd loaded straight into memory) or a
        // disk (a system disk in drive 0, which the machine boots). Menu entry
        // 11 uses the second: a diskless Model III stops at the ROM's
        // "Diskette?" prompt rather than reaching BASIC, so the disk is how it
        // gets there.
        let diskBytes = null;
        if (game.disk) {
          try {
            diskBytes = new Uint8Array(
              await (await fetch(game.disk)).arrayBuffer(),
            );
          } catch (e) {
            fail('Failed to load system disk: ' + e.message);
            return;
          }
        }
        let cmdBytes = null;
        if (game.rom) {
          try {
            cmdBytes = new Uint8Array(
              await (await fetch(game.rom)).arrayBuffer(),
            );
          } catch (e) {
            fail('Failed to load program: ' + e.message);
            return;
          }
        }
        let romBytes;
        try {
          romBytes = new Uint8Array(
            await (await fetch('model3.rom')).arrayBuffer(),
          );
        } catch (e) {
          return fail('Could not load the Model III ROM.');
        }

        // Model III, 48K. The Model III ROM is fetched and written into MEMFS
        // alongside the game rather than embedded in the wasm — the build bakes in
        // the Model I ROM at /level2.rom, and swapping machines that way would mean
        // a whole emscripten rebuild for a 14 KB file. -noled / -borderwidth 0
        // give a clean 512x384 text area with nothing but the screen. The .cmd is
        // written to MEMFS and passed as the positional arg; trs_load_cmd jumps
        // straight into it (no disk boot needed). -scale 2 for crisp pixels.
        createSDLTRS({
          canvas: canvas,
          arguments: [
            '-model',
            '3',
            '-romfile3',
            '/model3.rom',
            '-noled',
            '-borderwidth',
            '0',
            '-scale',
            '1',
          ]
            .concat(diskBytes ? ['-disk0', '/disk0.dsk'] : [])
            .concat(cmdBytes ? ['/game.cmd'] : []),
          preRun: [
            function (m) {
              if (cmdBytes) m.FS.writeFile('/game.cmd', cmdBytes);
              if (diskBytes) m.FS.writeFile('/disk0.dsk', diskBytes);
              m.FS.writeFile('/model3.rom', romBytes);
            },
          ],
          print: function () {},
          printErr: function () {},
        }).catch(function (e) {
          fail('Emulator failed: ' + (e && e.message ? e.message : e));
        });
      })();

      // Pick the scaling mode from the ratio actually on screen.
      //
      // Nearest-neighbour ("pixelated") is right when the picture is scaled UP:
      // it keeps the TRS-80's chunky glyphs crisp and square, which is both more
      // legible and more honest to the machine. It is wrong when scaled DOWN,
      // because it discards pixel rows rather than averaging them, and a dropped
      // row takes the top off a character — "High Score" rendered as "-igh Score"
      // before this was understood.
      //
      // The cutout can sit either side of 512 wide depending on the viewport, so
      // neither value is correct in CSS alone. Measure and choose.
      (function () {
        var canvas = document.getElementById('screen-canvas');
        var apply = function () {
          var shown = canvas.getBoundingClientRect().width;
          if (!shown) return;
          canvas.style.imageRendering =
            shown >= canvas.width ? 'pixelated' : 'auto';
        };
        apply();
        window.addEventListener('resize', apply);
        // The bezel image settles the layout after it decodes.
        window.addEventListener('load', apply);
      })();
    </script>
  </body>
</html>
