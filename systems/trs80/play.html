  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <style>
    /* CRT bezel — Radio Shack TRS-80 Model III (TRS80-3.png, 1498x1089,
       aspect 1.376): the all-in-one case, screen top-left, twin Mini Disk
       drives beside it, keyboard and numeric keypad in front, on a
       keyed-transparent background. It replaces the Model I's three-box
       sprawl of monitor, expansion interface and drive stack.
       Three layers, back to front:
         1. .screen-bg — black backdrop. It covers the WHOLE cutout plus 1%
            proud on every side, not just the area the picture occupies: the
            picture is inset within the glass, and the rest of the glass has to
            read as an unlit CRT face rather than as wallpaper showing through.
            The 1% margin is what stops the wallpaper bleeding through the
            PNG's anti-aliased hole edge.
         2. #screen    — holds the emulator's <canvas>, sized to the cutout.
         3. .bezel-img — TRS80-3.png on top; its transparent screen hole reveals
            the canvas, and the CRT's rounded corners trim the canvas corners.
       Screen hole measured (alpha flood-fill): left 17.82% top 7.16%
       w 41.52% h 45.73%; the picture is inset 5% from that, centred on the
       same point, so a little of the CRT's black surround shows all round
       rather than the image running right to the edge of the glass. The sdltrs canvas is a clean 512x384 (4:3) text area
       — no phosphor padding to overscan-crop — so the canvas just fills the
       cutout. Wallpaper override must follow genx-frame.css (body black). */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; color: #fff; font-family: monospace; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap {
      position: relative;
      height: 100vh;
      aspect-ratio: 1498 / 1089;
      max-width: 100vw;
    }
    .screen-bg {
      position: absolute;
      left: 16.82%; top: 6.16%; width: 43.52%; height: 47.73%;
      background: #000;
      z-index: 1;
    }
    #screen {
      position: absolute;
      left: 19.84%; top: 9.38%; width: 37.47%; height: 41.27%;
      z-index: 2;
      overflow: hidden;
    }
    /* Backing store is pinned to sdltrs's native surface (1024x768, via the
       canvas width/height attrs) so the software SDL_UpdateWindowSurface
       putImageData lands at full size; CSS then scales the display to fill the
       cutout. Don't set width/height attrs to anything but the surface size or
       only the top-left corner draws. */
    /* No image-rendering: pixelated here, and no transform: scale().
       The canvas backing store is 1024x768 and the cutout is smaller, so the
       browser is always DOWNSCALING. Nearest-neighbour downscaling does not
       average — it throws whole pixel rows away, and on a 12-pixel-tall TRS-80
       character that takes the top off the glyph: "High Score" rendered as
       "-igh Score". Smooth downscaling keeps every row and reads correctly.
       The scale(0.858) was a fudge for the Model I bezel, whose hole the
       canvas overflowed; #screen is measured to the Model III cutout, so the
       canvas fills it directly. object-fit keeps the 4:3 ratio inside a hole
       that is a little wider than 4:3, rather than squashing the text. */
    #screen canvas { display: block; width: 100% !important; height: 100% !important; object-fit: contain; outline: none; border: none; }
    #screen canvas:focus { outline: none; }
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
    }
    .err { padding: 20px; }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <script defer src="../_shared/genx-softkey-policy.js"></script>

</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="screen"><canvas id="screen-canvas" width="1024" height="768" tabindex="0"></canvas></div>
    <img class="bezel-img" src="../_shared/bezels/TRS80-3.png" alt="">
  </div>

  <!-- sdltrs.js defines the createSDLTRS() factory; it MUST load before the
       boot code below references it. -->
  <script src="sdltrs.js"></script>
  <script>
    (async function () {
      const fail = (msg) => {
        const d = document.createElement('div');
        d.className = 'err';
        d.textContent = msg;
        document.body.replaceChildren(d);
      };
      const canvas = document.getElementById('screen-canvas');
      const params = new URLSearchParams(location.search);
      const key = params.get('game');
      if (!key) { document.title = 'Tandy TRS-80'; return; }

      let games;
      try { games = await (await fetch('games.json')).json(); }
      catch (e) { fail('Failed to load games.json: ' + e.message); return; }
      const game = games[key];
      if (!game) { fail('Unknown game key: ' + key); return; }
      document.title = 'Tandy TRS-80';

      let cmdBytes;
      try { cmdBytes = new Uint8Array(await (await fetch(game.rom)).arrayBuffer()); }
      catch (e) { fail('Failed to load program: ' + e.message); return; }
      let romBytes;
      try { romBytes = new Uint8Array(await (await fetch('model3.rom')).arrayBuffer()); }
      catch (e) { return fail('Could not load the Model III ROM.'); }

      // Model III, 48K. The Model III ROM is fetched and written into MEMFS
      // alongside the game rather than embedded in the wasm — the build bakes in
      // the Model I ROM at /level2.rom, and swapping machines that way would mean
      // a whole emscripten rebuild for a 14 KB file. -noled / -borderwidth 0
      // give a clean 512x384 text area with nothing but the screen. The .cmd is
      // written to MEMFS and passed as the positional arg; trs_load_cmd jumps
      // straight into it (no disk boot needed). -scale 2 for crisp pixels.
      createSDLTRS({
        canvas: canvas,
        arguments: ['-model', '3', '-romfile3', '/model3.rom', '-noled', '-borderwidth', '0', '-scale', '2', '/game.cmd'],
        preRun: [function (m) { m.FS.writeFile('/game.cmd', cmdBytes); m.FS.writeFile('/model3.rom', romBytes); }],
        print: function () {},
        printErr: function () {},
      }).catch(function (e) { fail('Emulator failed: ' + (e && e.message ? e.message : e)); });
    })();
  </script>
</body>
</html>
