<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <script src="../_shared/genx-bezel-ready.js"></script>
  <script src="../_shared/genx-audio-banner.js"></script>
  <meta charset="utf-8"><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commodore 128</title>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <style>
    /* CRT bezel — Commodore 1084S monitor (Commodore.png, 1223x1104, screen
       keyed to a transparent hole; the set floats on the 70s wallpaper).
       Shared by the whole VICE family (c64/c128/c16/plus4/vic20/max) — same
       monitor, same hole. EJS owns the canvas, so #game sits in the screen
       hole and EJS draws into it. Layers (back to front):
         1. .screen-bg — black backdrop, slightly larger than the hole (covers
            the cutout's anti-aliased edge so wallpaper can't bleed through).
         2. #game      — the EJS player at the measured hole.
         3. .bezel-img — Commodore.png on top; canvas shows through the hole.
       Screen hole (measured): left 12.3% top 12.5% width 76.0% height 63.9%.
       The wallpaper override must follow genx-frame.css (which sets body
       black); the VICE numlock/softkey banners are position:fixed, so the
       flex-centred bezel is unaffected. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap {
      position: relative;
      width: min(100vw, calc((100dvh - 120px) * 1223 / 1104));
      aspect-ratio: 1223 / 1104;
    }
    .screen-bg {
      position: absolute;
      left: 10.3%; top: 10.5%; width: 80.0%; height: 67.9%;
      background: #000;
      z-index: 1;
    }
    #game {
      position: absolute;
      left: 12.3%; top: 12.5%; width: 76.0%; height: 63.9%;
      overflow: hidden;
      z-index: 2;
    }
    /* EJS fits the canvas to #game preserving aspect; height:100% closes the
       tiny letterbox. (The old 856×288 scaleY hack belonged to the stable
       x128 core, which boots to garbage; the nightly core we run renders a
       normal framebuffer like the rest of the family.) The two video chips
       fill the glass differently — the 80-col VDC picture sits smaller than
       the 40-col VIC-II one — so each mode gets its own scale. perGame tags
       <html> with the active mode (see the script below). */
    #game canvas { height: 100% !important; }
    html.gx-vicii #game canvas { transform: scale(1.01); }  /* 40-col VIC-II — family default */
    html.gx-vdc   #game canvas { transform: scale(1.26); }  /* 80-col VDC — needs the extra fill */
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
    }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/styles/genx-savestate.css">
  <script defer src="../_shared/genx-savestate.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>
  <link rel="preload" href="../_shared-ejs/ejs/data/cores/vice_x128-legacy-wasm.data" as="fetch" crossorigin>
  <script defer src="../_shared/genx-numlock-warn.js"></script>
  <script defer src="../_shared/genx-vice-softkeys.js"></script>
  <script src="../_shared-ejs/genx-ejs-boot.js"></script>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="game"><div class="loading">Booting Commodore 128…</div></div>
    <img class="bezel-img" src="../_shared/bezels/Commodore.png" alt="">
  </div>
  <script>
    // C128 — VICE x128 in native mode (vice_c128_go64='disabled' skips
    // C64-compat mode — we have a separate c64 bundle for that). Per-game
    // `video` field in games.json toggles VICII (40-col) vs VDC (80-col);
    // default is VICII.
    genxBootEJS({
      title: 'Commodore 128',
      coreName: 'vice_x128',
      defaultOptions: {
        'vice_c128_go64': 'disabled',
        'vice_aspect_ratio': 'pal',
        'vice_drive_true_emulation': 'enabled',
        'vice_drive_sound_emulation': '100%',
        'vice_autoloadwarp': 'disabled',
        'keyboardInput': 'enabled',
        'altKeyboardInput': 'enabled',
        'vice_joyport_type': '1'
      },
      perGame: (game, opts) => {
        // Per-game 40/80-col selection. The libretro option values are the
        // bare keys VICII / VDC (the core's "VIC-II (40 cols)" / "VDC (80
        // cols)" strings are display labels, NOT settable values — passing a
        // label makes the core reject it and fall back to 40-col VIC-II).
        const vdc = (game && game.video) === 'VDC';
        opts['vice_c128_video_output'] = vdc ? 'VDC' : 'VICII';
        // 80-col VDC sits smaller in the glass than 40-col VIC-II, so tag the
        // page and let CSS pick the right canvas fill scale (see <style>).
        document.documentElement.classList.add(vdc ? 'gx-vdc' : 'gx-vicii');
      }
    });
  </script>
</body>
</html>
