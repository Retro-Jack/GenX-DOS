<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NES</title>
  <style>
    /* CRT bezel — Sony Trinitron XBR with the NES on the shelf (nes.png,
       2888x2611, maintainer-keyed, the set floating on the wallpaper with a
       transparent screen hole at 17.71%/21.48%/60.83%×51.73%). EmulatorJS sizes
       its canvas to #game, so #game sits in the screen hole; .screen-bg (black,
       ~2% larger) hides the cutout's AA edge; nes.png on top. The bottom shelf
       cubbies are also keyed through (wallpaper shows behind — natural). NES
       native 256x240 (8:7 PAR), shown 4:3. !important on the wallpaper because
       genx-frame.css loads AFTER this <style> and resets body to black. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat !important; background-size: 220px !important; overflow: hidden; }
    body { display: flex !important; align-items: flex-end !important; justify-content: center !important; }
    .bezel-wrap { position: relative; width: min(100vw, calc(100dvh * 2888 / 2611)); aspect-ratio: 2888 / 2611; transform: translateY(1px); }
    .screen-bg { position: absolute; left: 16.71%; top: 20.48%; width: 62.83%; height: 53.73%; background: #000; z-index: 1; }
    #game { position: absolute; left: 17.71%; top: 21.48%; width: 60.83%; height: 51.73%; overflow: hidden; z-index: 2; }
    #game canvas { height: 100% !important; transform: scale(0.88); }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
  </style>
  <link rel="stylesheet" href="../_shared/genx-frame.css">
  <link rel="stylesheet" href="../_shared/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/genx-controls-link.css">
  <script defer src="../_shared/genx-controls-link.js"></script>
  <link rel="stylesheet" href="../_shared/genx-savestate.css">
  <script defer src="../_shared/genx-savestate.js"></script>
  <link rel="preload" href="../_shared-ejs/ejs/data/cores/fceumm-legacy-wasm.data" as="fetch" crossorigin>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="game"><div class="loading">Booting NES…</div></div>
    <img class="bezel-img" src="../_shared/bezels/nes.png" alt="">
  </div>
  
  <script>
    (async function () {
      const fail = (msg) => { document.getElementById('game').innerHTML = '<div class="err">' + msg + '</div>'; };
      const params = new URLSearchParams(location.search);
      const key = params.get('game');

      let gameUrl = null;
      let game = null;
      if (key) {
        let games;
        try { games = await (await fetch('games.json')).json(); }
        catch (e) { fail('Failed to load games.json: ' + e.message); return; }
        game = games[key];
        if (!game) { fail('Unknown game key: ' + key); return; }
        document.title = game.title || key;
        gameUrl = game.rom;
      } else {
        document.title = 'NES';
      }

      window.EJS_player    = '#game';
      window.EJS_pathtodata = (location.pathname.match(/^.*\/systems\//) || ['../'])[0] + '_shared-ejs/ejs/data/';
      window.EJS_core      = 'nes';
      window.EJS_startOnLoaded = true;
      window.EJS_DEBUG_XX  = true;
      // Preserve the previous bfirsh/jsnes muscle memory: X = A, Z = B.
      // EJS's RetroPad default has B (button 0) on `x` and A (button 8) on
      // `z` — period-correct to the physical NES (A on right, B on left)
      // but inverse to how the previous build mapped these keys. Swap
      // them so users who knew the old setup don't have to relearn.
      window.EJS_defaultControls = {
        0: {
          0: { value: 'z' },  // B
          8: { value: 'x' }   // A
        }
      };
      if (gameUrl) window.EJS_gameUrl = new URL(gameUrl, location.href).href;

      const s = document.createElement('script');
      s.src = '../_shared-ejs/ejs/data/loader.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
