<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">

  <script src="../_shared/genx-audio-banner.js"></script>
  <meta charset="utf-8"><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColecoVision</title>
  <style>
    /* CRT bezel — wood-cabinet console TV (70s.png, 1240x855), shared with the
       Atari 2600 (stella), Intellivision and Odyssey². EJS sizes its canvas to
       #game, so #game sits in the screen hole (27.6%/13.1%/45.4%×51.6%) and EJS
       draws into it; .screen-bg (black, ~2% larger) hides the cutout's AA edge;
       70s.png on top. !important on the wallpaper because genx-frame.css loads
       AFTER this <style> and resets body to black. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat !important; background-size: 220px !important; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap { position: relative; width: min(100vw, calc((100dvh - 120px) * 1240 / 855)); aspect-ratio: 1240 / 855; }
    .screen-bg { position: absolute; left: 25.6%; top: 11.1%; width: 49.4%; height: 55.6%; background: #000; z-index: 1; }
    #game { position: absolute; left: 27.6%; top: 13.1%; width: 45.4%; height: 51.6%; overflow: hidden; z-index: 2; }
    #game canvas { height: 100% !important; transform: scale(1.08); }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
  </style>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/styles/genx-savestate.css">
  <script defer src="../_shared/genx-savestate.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>
  <link rel="preload" href="../_shared-ejs/ejs/data/cores/gearcoleco-legacy-wasm.data" as="fetch" crossorigin>
  <script defer src="../_shared/genx-numlock-warn.js"></script>
  <script src="../_shared-ejs/genx-ejs-lang.js"></script>
    <script src="../_shared-ejs/genx-ejs-boot.js"></script>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="game"><div class="loading">Booting ColecoVision…</div></div>
    <img class="bezel-img" src="../_shared/bezels/70s.png" alt="">
  </div>
  <script>
    // ColecoVision — gearcoleco core. BIOS bundle-local. Numpad-as-keypad
    // remap via EJS_defaultControls (gearcoleco puts the 12-key keypad on
    // RetroPad Y/X/L/R/L2/R2/L3/R3 + START/SELECT + analog-stick for 9/0;
    // we override to drive the whole keypad off the PC numpad — period-
    // correct shape).
    genxBootEJS({
      title: 'ColecoVision',
      coreName: 'coleco',
      biosUrl: 'colecovision.rom',
      defaultControls: {
        0: {
          1:  { value: 'numpad 1' },   // Y      → keypad 1
          9:  { value: 'numpad 2' },   // X      → keypad 2
          10: { value: 'numpad 3' },   // L      → keypad 3
          11: { value: 'numpad 4' },   // R      → keypad 4
          12: { value: 'numpad 5' },   // L2     → keypad 5
          13: { value: 'numpad 6' },   // R2     → keypad 6
          14: { value: 'numpad 7' },   // L3     → keypad 7
          15: { value: 'numpad 8' },   // R3     → keypad 8
          3:  { value: 'multiply' },   // START  → keypad * (numpad *)
          2:  { value: 'subtract' },   // SELECT → keypad # (numpad -)
          16: { value: 'numpad 9' },   // LStickX+ → keypad 9
          17: { value: 'numpad 0' }    // LStickX- → keypad 0
        }
      }
    });
  </script>
</body>
</html>
