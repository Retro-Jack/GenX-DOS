<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <script src="../_shared/genx-bezel-ready.js"></script>
  <script src="../_shared/genx-audio-banner.js"></script>
  <meta charset="utf-8"><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mattel Intellivision</title>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <style>
    /* CRT bezel — wood-cabinet console TV (70s.png, 1240x855), shared with the
       Atari 2600 and ColecoVision. jzintv draws into #canvas which fills #stage,
       so #stage is pinned into the screen hole (27.6%/13.1%/45.4%×51.6%) and the
       canvas stretches to fill it; .screen-bg (black, ~2% larger) hides the
       cutout's AA edge; 70s.png on top.
       (Intellivision STIC framebuffer is 159x96 visible / ~5:3 raw; the console
       drove a 4:3 set with non-square pixels, so filling the ~4:3 hole is right.) */
    html, body { background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; }
    .bezel-wrap { position: relative; width: min(100vw, calc((100dvh - 120px) * 1240 / 855)); aspect-ratio: 1240 / 855; }
    .screen-bg { position: absolute; left: 25.6%; top: 11.1%; width: 49.4%; height: 55.6%; background: #000; z-index: 1; }
    #stage { position: absolute; left: 27.6%; top: calc(13.1% - 1px); width: 45.4%; height: calc(51.6% + 2px); overflow: hidden; z-index: 2; }
    #canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <script src="../_shared/genx-game-loader.js"></script>
  <link rel="preload" href="jzintv.wasm" as="fetch" crossorigin>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="stage">
      <canvas id="canvas" tabindex="0"></canvas>
      <div id="loading" class="loading">Booting Intellivision…</div>
    </div>
    <img class="bezel-img" src="../_shared/bezels/70s.png" alt="">
  </div>
  
  <script>
    (async function () {
      const _gx = await window.genxLoadGame('#loading');
      if (!_gx) return;
      const { key, game, fail } = _gx;
      let execBuf, gromBuf, romBuf;
      try {
        [execBuf, gromBuf, romBuf] = await Promise.all([
          fetch('exec.bin').then(r => r.arrayBuffer()),
          fetch('grom.bin').then(r => r.arrayBuffer()),
          fetch(game.rom).then(r => r.arrayBuffer())
        ]);
      } catch (e) { fail('Failed to fetch ROM/BIOS: ' + e.message); return; }

      // Emscripten Module config. jzintv.js exports `Module.launchJzintv`
      // which writes exec.bin, grom.bin, game.<ext> into the WASM FS,
      // then calls Module.callMain with the right argv. `jzintv.data` is
      // emscripten-preloaded automatically (contains the default
      // desk.kbd keyboard mapping).
      window.Module = {
        canvas: document.getElementById('canvas'),
        print: () => {},
        printErr: e => console.warn('[jzintv]', e),
        noInitialRun: true,
        onRuntimeInitialized: function () {
          try {
            Module.launchJzintv(execBuf, gromBuf, romBuf, null, [], null, null, 'int', null);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('canvas').focus();
          } catch (e) {
            fail('jzintv start failed: ' + e.message);
          }
        }
      };

      const s = document.createElement('script');
      s.src = 'jzintv.js';
      s.onerror = () => fail('Failed to load jzintv.js');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
