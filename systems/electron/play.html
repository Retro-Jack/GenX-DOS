<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000 url('../_shared/textures/70s-bg.png') repeat;
    background-size: 220px;
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* Three-layer bezel order (back → front):
     1. .screen-bg  — solid black backdrop slightly bigger than the canvas
     2. canvas      — the actual emulator surface
     3. .bezel-img  — Acorn.png monitor PNG on top, cutout reveals canvas
     Acorn.png is 835x719 (aspect 1.161). Cutout bbox, flood-filled from the
     centre of the hole: 51,44..788,666 = 738x623. Do NOT size the canvas to
     that. The hole is a rounded rectangle, so what fits is the largest
     inscribed rectangle -- 85,73..753,637, i.e. 10.24%/10.169%/80%/78.41% --
     and that is what the canvas is set to.
     The Electron matters here in a way the CoCo does not: its addressable area
     runs edge to edge with no screen border, so any overshoot clips real
     content rather than border. Pushing the canvas out to the cutout bbox on
     30/08/2026 cut the leftmost character column -- the boot banner came up as
     "orn Electron" and "3ASIC" -- and was reverted. The magenta ring visible
     between this rectangle and the hole's curve is the corners, and is expected:
     it cannot be filled without losing characters. */
  .bezel-wrap {
    position: relative;
    /* Cap height at 100dvh - 120px so ~60px of wallpaper shows above and
       below (matches the jsbeeb CUB monitor spacing). The flex-centred
       body splits the slack evenly top/bottom. */
    width: min(100vw, calc((100dvh - 120px) * 835 / 719));
    aspect-ratio: 835 / 719;
  }
  .screen-bg {
    position: absolute;
    inset: 5%;
    background: #000;
    z-index: 1;
  }
  #ElkJsOutput {
    position: absolute;
    left: 10.24%;
    top: 10.169%;
    width: 80%;
    height: 78.41%;
    image-rendering: pixelated;
    z-index: 2;
  }
  .bezel-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 3;
  }
</style>

<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <canvas id="ElkJsOutput" width="640" height="512"></canvas>
    <img class="bezel-img" src="../_shared/bezels/Acorn.png" alt="">
  </div>
  <script>
  var elkjs = ElkJs("ElkJsOutput");
  var games = {
    snapper:   'snapper_snap.uef',
    citadel:   'citadel_snap.uef',
    starship:  'StarshipCommand_snap.uef',
    boxer:     'boxer_snap.uef',
    cybertron: 'cybertronmission_snap.uef',
    elite:     'Elite_snap.uef'
  };
  var key = new URLSearchParams(location.search).get('game');
  if (key && games[key]) {
    setTimeout(function() { elkjs.openFile(games[key]); }, 3000);
  }

  // USB gamepad → keyboard maps, one per game (each game has its own keys).
  // ElkJS reads evt.keyCode from document-level key events, which is exactly
  // what the shared shim synthesizes. Keycodes follow keyboard.js's table.
  var K = {
    Z:      { key: 'z', code: 'KeyZ',   keyCode: 90 },
    X:      { key: 'x', code: 'KeyX',   keyCode: 88 },
    A:      { key: 'a', code: 'KeyA',   keyCode: 65 },
    S:      { key: 's', code: 'KeyS',   keyCode: 83 },
    T:      { key: 't', code: 'KeyT',   keyCode: 84 },
    E:      { key: 'e', code: 'KeyE',   keyCode: 69 },
    M:      { key: 'm', code: 'KeyM',   keyCode: 77 },
    N:      { key: 'n', code: 'KeyN',   keyCode: 78 },
    quote:  { key: "'", code: 'Quote',  keyCode: 222 },
    slash:  { key: '/', code: 'Slash',  keyCode: 191 },
    comma:  { key: ',', code: 'Comma',  keyCode: 188 },
    period: { key: '.', code: 'Period', keyCode: 190 },
    space:  { key: ' ', code: 'Space',  keyCode: 32 },
    enter:  { key: 'Enter', code: 'Enter', keyCode: 13 },
    shift:  { key: 'Shift', code: 'ShiftLeft', keyCode: 16 }
  };
  var zxud = { left: K.Z, right: K.X, up: K.quote, down: K.slash };
  var pads = {
    // Face buttons 0=A 1=B 2=X 3=Y; 9=Start. Start is mapped only where a
    // game's title screen needs a key the gameplay buttons don't already
    // send — Cybertron Mission says "PRESS SPACE TO START OR FIRE BUTTON",
    // but its fire is the M key and the title only answers to Space (or a
    // real joystick's fire line, which this emulator has no support for),
    // so without Start a pad player is stuck on the title. Games whose face
    // buttons already send Space (Snapper, Citadel, Elite) need nothing.
    snapper:   { axes: zxud,
                 buttons: { 0: K.space, 1: K.space, 2: K.space, 3: K.space } },
    citadel:   { axes: zxud,
                 buttons: { 0: K.enter, 1: K.space } },
    boxer:     { axes: zxud,
                 buttons: { 0: K.enter, 1: K.shift } },
    cybertron: { axes: { left: K.comma, right: K.period, up: K.A, down: K.Z },
                 buttons: { 0: K.M, 1: K.M, 2: K.M, 3: K.M, 9: K.space } },
    starship:  { axes: { left: K.Z, right: K.X, up: K.M, down: K.comma },
                 buttons: { 0: K.N, 1: K.N, 2: K.N, 3: K.N } },
    // Flightsim-style games get the vertical axis inverted: up climbs.
    elite:     { axes: { left: K.comma, right: K.period, up: K.X, down: K.S },
                 buttons: { 0: K.A, 1: K.space, 2: K.slash, 3: K.T,
                            4: K.E, 5: K.M } }
  };
  if (key && pads[key]) window.GenXGamepadMap = pads[key];
  </script>
  <script src="../_shared/genx-gamepad-keys.js"></script>
  <script>

  // Audio unlock. ElkJS creates the AudioContext suspended (autoplay policy).
  // Best-effort: piggyback on the window.open user-activation propagated from
  // the prompt launcher click. Reliable: resume on every real user gesture —
  // resumeAudio() is idempotent (only resumes when suspended) so leaving the
  // listeners attached is harmless.
  function _enableSound() { try { elkjs.resumeAudio(); } catch (e) {} }
  document.addEventListener('DOMContentLoaded', function () {
    [0, 100, 500, 1000, 2000].forEach(function (t) { setTimeout(_enableSound, t); });
  });
  ['keydown', 'pointerdown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, _enableSound);
  });
  </script>
