<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <script src="../_shared/genx-bezel-ready.js"></script>
    <script src="../_shared/genx-audio-banner.js"></script>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="../_shared/favicon.ico" />
    <link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MSX1</title>
    <style>
      /* CRT bezel — vintage TV (TV-Vintage.png, 1362x914, screen keyed to a
       4:3 hole, the hole measured at its OUTER bound (alpha < 250, so the feathered
       edge falls inside it): left 6.975% top 10.503% width 67.621%
       height 77.352%. Measuring to the inner bound (alpha < 32) instead
       leaves the feather compositing over .screen-bg — invisible while
       that is black, a bright fringe otherwise). Shared with the Spectrum/ZX81 bundles; the set floats on the
       70s wallpaper. WebMSX (SCREEN_RESIZE_DISABLED:false) sizes its canvas to
       fit #wmsx-screen, so we put #wmsx in the hole and force the canvas to
       fill it. The canvas is drawn flat. !important on the
       wallpaper because genx-frame.css loads AFTER this <style>. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000 url('../_shared/textures/70s-bg.png') repeat !important;
        background-size: 220px !important;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bezel-wrap {
        position: relative;
        width: min(100vw, calc((100dvh - 120px) * 1362 / 914));
        aspect-ratio: 1362 / 914;
      }
      .screen-bg {
        position: absolute;
        left: 6.6%;
        top: 10.6%;
        width: 68.4%;
        height: 77%;
        background: #000;
        z-index: 1;
      }
      #wmsx {
        position: absolute;
        left: 6.975%;
        top: 10.503%;
        width: 67.621%;
        height: 77.352%;
        overflow: visible;
        z-index: 2;
      }
      #wmsx-screen {
        width: 100%;
        height: 100%;
        box-shadow: none;
      }
      #wmsx-screen-canvas-outer,
      #wmsx-screen-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #wmsx-screen-canvas {
        image-rendering: pixelated;
        /* transform is set at runtime — see the fit script below */
        transform-origin: top left;
      }
      /* hide WebMSX's control bar entirely (GenX bundles don't show emulator chrome) */
      #wmsx-bar {
        display: none !important;
      }
      /* hide WebMSX's on-screen OSD toasts (e.g. "AUTO: NTSC 60Hz", state/media
       notices) — a DOM overlay; our save/load buttons flash their own status */
      #wmsx-osd {
        display: none !important;
      }
      .bezel-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 3;
      }
    </style>
    <link rel="stylesheet" href="../_shared/styles/genx-frame.css" />
    <link rel="stylesheet" href="../_shared/styles/genx-noscript.css" />
    <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css" />
    <script>
      /* Clean WebMSX integration (rebuilt 16/06/2026 from the official 6.0
       *embedded* build: wmsx.js is the engine, this file is OUR wrapper, so
       the engine is never edited — no risk of the old all-in-one breakage
       where an injected closing-script-tag closed the inline engine).

       ALLOW_URL_PARAMETERS lets the engine read the menu's ?ROM= / ?M= / ?ANY=
       params and auto-load (ROM->CARTRIDGE1_URL, M->MACHINE, ANY->AUTODETECT_URL
       via WebMSX's own abbreviations). The extra ?game= param is ignored by
       the engine and consumed by genx-controls-link.js for the controls link. */
      window.WMSX = {
        SCREEN_ELEMENT_ID: 'wmsx-screen',
        ALLOW_URL_PARAMETERS: true,
        SCREEN_CONTROL_BAR: 0 /* 0 = auto-hide (on hover); 1 = always */,
      };
      (function () {
        var g = new URLSearchParams(location.search).get('game');
        document.title = 'MSX1';
      })();
    </script>
  </head>
  <body>
    <noscript
      ><div class="gx-noscript">
        <div class="gx-noscript-title">JavaScript Required</div>
        <div>This site is a client-side DOS terminal and emulator suite.</div>
        <div>It needs JavaScript to run.</div>
        <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
      </div></noscript
    >

    <div class="bezel-wrap">
      <div class="screen-bg"></div>
      <div id="wmsx"><div id="wmsx-screen"></div></div>
      <img class="bezel-img" src="../_shared/bezels/TV-Vintage.png" alt="" />
    </div>

    <!-- engine: stock embedded build, never modified -->
    <script src="wmsx.js"></script>
    <!-- controls link added as a normal element AFTER the engine: no </script> can leak into the engine -->
    <script defer src="../_shared/genx-controls-link.js"></script>
    <script defer src="../_shared/genx-repo-link.js"></script>

    <!-- save / load state: WebMSX exposes WMSX.room.machine with saveState()/
       loadState() (the same API its netplay uses). -->
    <link rel="stylesheet" href="../_shared/styles/genx-savestate.css" />
    <script>
      window.GenXStateAdapter = {
        ready: function () {
          return !!(
            window.WMSX &&
            WMSX.room &&
            WMSX.room.machine &&
            typeof WMSX.room.machine.saveState === 'function'
          );
        },
        getState: function () {
          return WMSX.room.machine.saveState(true);
        },
        setState: function (s) {
          WMSX.room.machine.loadState(s);
        },
        refocus: function () {
          var c = document.getElementById('wmsx-screen-canvas');
          if (c && c.focus) c.focus();
        },
      };
    </script>
    <script defer src="../_shared/genx-savestate-std.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>

    <script>
      /* Fit the WebMSX canvas to the bezel hole.
         WebMSX sizes #wmsx-screen-canvas-outer itself, preserving its own
         frame aspect, so the canvas comes out taller than the hole and spills
         (overflow is visible). This used to be handled by a fixed
         `transform: translate(8px,-10px) scale(0.842)`, which fitted the
         canvas INSIDE the hole rather than filling it — the MSX's own border
         stopped short of the glass on all four sides, with WebMSX's black
         #wmsx-screen behind filling the gap. Found by the bezel test card
         (white border, black playfield) on 03/09/2026.
         A fixed scale cannot be right at every viewport, and WebMSX re-sizes
         the canvas whenever the machine changes video mode (SCREEN 0 vs 1),
         so the transform is computed here instead and re-applied on resize.
         The transform is on the canvas only, so measuring #wmsx and the outer
         is unaffected by it. Stretching to the hole is correct, not distortion:
         the MSX signal is meant to be shown at 4:3 and the hole is 4:3. */
      (function () {
        function fit() {
          var w = document.getElementById('wmsx'),
            o = document.getElementById('wmsx-screen-canvas-outer'),
            c = document.getElementById('wmsx-screen-canvas');
          if (!w || !o || !c) return;
          var wr = w.getBoundingClientRect(),
            or = o.getBoundingClientRect();
          if (!or.width || !or.height) return;
          c.style.transformOrigin = 'top left';
          c.style.transform =
            'translate(' + (wr.left - or.left) + 'px,' + (wr.top - or.top) + 'px) ' +
            'scale(' + wr.width / or.width + ',' + wr.height / or.height + ')';
        }
        window.addEventListener('resize', fit);
        window.addEventListener('load', fit);
        var o = null;
        var iv = setInterval(function () {
          var el = document.getElementById('wmsx-screen-canvas-outer');
          if (!el) return;
          clearInterval(iv);
          fit();
          if (window.ResizeObserver) new ResizeObserver(fit).observe(el);
        }, 100);
      })();
    </script>

  </body>
</html>
