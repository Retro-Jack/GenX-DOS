<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commodore PET</title>
  <link rel="stylesheet" href="../_shared/genx-frame.css">
  <link rel="stylesheet" href="../_shared/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/genx-controls-link.css">
  <style>
    /* CRT bezel — Commodore PET 2001 (Pet.png, 1024x771, aspect 1.328).
       Three layers, back to front:
         1. .screen-bg  — black backdrop behind the screen hole, a touch
            larger than the cutout so the wallpaper can't bleed through the
            PNG's anti-aliased hole edge.
         2. #petscreen  — the emulator canvas, sized to the cutout.
         3. .bezel-img  — Pet.png on top; its transparent hole reveals the
            canvas. Hole detected at left 26.86% top 17.12% w 44.34% h 42.28%;
            canvas inset ~4.5% per side so its edges tuck under the bezel lip.
       Wallpaper override must follow genx-frame.css (which sets body black). */
    html, body { background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; }
    .bezel-wrap {
      position: relative;
      width: min(100vw, calc(100dvh * 1024 / 771));
      aspect-ratio: 1024 / 771;
    }
    .screen-bg {
      position: absolute;
      left: 25%; top: 15.5%; width: 47.5%; height: 45.5%;
      background: #000;
      z-index: 1;
    }
    #petscreen {
      position: absolute;
      left: 30.3%; top: 20.5%; width: 37.3%; height: 35.4%;
      image-rendering: pixelated;
      background: #000;
      z-index: 2;
    }
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
    }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
  <script src="pet2001/cpu6502.js"></script>
  <script src="pet2001/petkeys-600.js"></script>
  <script src="pet2001/pet2001roms.js"></script>
  <script src="pet2001/pet2001hw.js"></script>
  <script src="pet2001/pet2001ieee.js"></script>
  <script src="pet2001/pet2001io.js"></script>
  <script src="pet2001/pet2001video-mod.js"></script>
  <script src="pet2001/pet2001.js"></script>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <canvas id="petscreen" width="640" height="400"></canvas>
    <img class="bezel-img" src="../_shared/bezels/Pet.png" alt="">
  </div>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var key = params.get('game');

      var ctx = document.getElementById('petscreen').getContext('2d');
      window.pet2001 = new Pet2001(ctx);
      // PET 2001 shipped with 4/8K; bump to 32K so BASIC programs that
      // expect a 3032-era machine (e.g. Adventureland, Frogger) don't
      // overrun zero-page on LOAD.
      pet2001.setRamSize(32 * 1024);

      // 50ms interval mirrors Skibo's reference loop — drives ~1 MHz emulated.
      var INTERVAL_MS = 50;
      setInterval(function () { pet2001.cycle(1000 * INTERVAL_MS); }, INTERVAL_MS);

      // Keyboard — Skibo wires keydown + keypress only; release is auto on a timer.
      window.onkeydown = petkeyOnKeyDown;
      window.onkeypress = petkeyOnKeyPress;

      // Video blank-timeout hook (Skibo's setTimeout uses global lookup).
      window.blankTimeoutFunc = function () { pet2001.blankTimeoutFunc(); };

      if (!key) { document.title = 'Commodore PET'; return; }

      var games;
      try { games = await (await fetch('games.json')).json(); }
      catch (e) {
        document.body.innerHTML = '<div class="err">Failed to load games.json: ' + e.message + '</div>';
        return;
      }
      var game = games[key];
      if (!game) {
        document.body.innerHTML = '<div class="err">Unknown game key: ' + key + '</div>';
        return;
      }
      document.title = 'Commodore PET';
      if (!game.rom) return;

      // PRG format: first 2 bytes are little-endian load address, rest is data.
      try {
        var buf = new Uint8Array(await (await fetch(game.rom)).arrayBuffer());
        var addr = buf[0] | (buf[1] << 8);
        var bytes = Array.from(buf.subarray(2));
        pet2001.ieeeLoadData(addr, bytes);
      } catch (e) {
        console.warn('PRG load failed:', e);
        return;
      }

      // Autostart: type LOAD"*",8<CR> then RUN<CR> via Skibo's keypress queue.
      // 0-entries between codes release prior keys (PET keyboard matrix needs
      // a clear-cycle between identical scans). Each queue item = 50ms.
      function queueChars(text) {
        for (var i = 0; i < text.length; i++) {
          petkeyKeyQueue.push(0);
          petkeyKeyQueue.push(text.charCodeAt(i));
        }
        if (petkeyKeypressTimeoutHandle == null) {
          petkeyKeypressTimeoutHandle = setTimeout(
            'petkeyKeypressTimeout()', petkeyKeypressTimeoutTime);
        }
      }
      var BOOT_MS = 1500;       // wait for PET RAM-clear + BASIC banner
      var LOAD_WAIT_MS = 6000;  // worst case ~18KB PRG via IEEE
      // Skibo's ascii_to_pet_* tables only map lowercase letters; PC 'l'
      // (108) presses the PET 'L' key, which is displayed as 'L'.
      var runCmd = game.autostart || 'run\r';
      setTimeout(function () { queueChars('load"*",8\r'); }, BOOT_MS);
      setTimeout(function () { queueChars(runCmd); }, BOOT_MS + LOAD_WAIT_MS);
    })();
  </script>

</body>
</html>
