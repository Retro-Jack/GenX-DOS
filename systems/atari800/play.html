<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <script src="../_shared/genx-audio-banner.js"></script>
  <meta charset="utf-8" /><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atari 800</title>
  <link rel="stylesheet" href="../_shared/styles/genx-frame.css">
  <link rel="stylesheet" href="../_shared/styles/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css">
  <style>
    /* CRT bezel — early-'80s wood-cabinet CRT television (80s.png, 1680x1125).
       The set floats on the wallpaper: the PNG has a transparent background
       around the cabinet AND a transparent screen hole. Layers, back to front:
         1. .screen — clip box at the screen cutout (overflow:hidden, black
            backdrop). The canvas lives INSIDE it, scaled up past 100% to crop
            the Atari overscan border; the clip keeps that overflow from
            bleeding onto the wallpaper through the transparent cabinet margins.
         2. .bezel-img — 80s.png on top; the canvas shows through the hole and
            the rounded-corner frame trims the screen's sharp corners.
       Screen hole (measured): left 15.4% top 21.3% width 46.4% height 52.8%.
       Height capped at 100dvh-120px so wallpaper shows around the set.
       Wallpaper override must follow genx-frame.css (which sets body black). */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat; background-size: 220px; color: #fff; font-family: monospace; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap {
      position: relative;
      width: min(100vw, calc((100dvh - 120px) * 1.25 * 1680 / 1125));
      aspect-ratio: 1680 / 1125;
    }
    .screen {
      position: absolute;
      left: 15.4%; top: 21.3%; width: 46.4%; height: 52.8%;
      background: #000;
      overflow: hidden;
      z-index: 1;
    }
    #canvas {
      /* The canvas fills the cutout exactly. atari800 is told (via -stretch
         full / -fit-screen both / -image-aspect none, see play.html args) to
         stretch its visible TV area to the whole canvas, so the picture meets
         all four cutout corners with no letterboxing and no viewport-dependent
         integer-scale quantisation. */
      position: absolute;
      left: 0; top: 0; width: 100%; height: 100%;
      image-rendering: pixelated;
      background: #000;
      outline: none;
    }
    .bezel-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 2;
    }
    .err { padding: 20px; }
  </style>
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/styles/genx-savestate.css">
  <script defer src="../_shared/genx-savestate-std.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>
</head>
<body>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>
  <div class="bezel-wrap">
    <div class="screen">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <img class="bezel-img" src="../_shared/bezels/80s.png" alt="">
  </div>
  <script>
    (async function () {
      const fail = (msg) => {
        const d = document.createElement('div');
        d.className = 'err';
        d.textContent = msg;
        document.body.replaceChildren(d);
      };
      const params = new URLSearchParams(location.search);
      const key = params.get('game');
      let romUrl = null, vfsName = null, game = null;

      if (key) {
        let games;
        try {
          games = await (await fetch('games.json')).json();
        } catch (e) {
          fail('Failed to load games.json: ' + e.message);
          return;
        }
        game = games[key];
        if (!game) { fail('Unknown game key: ' + key); return; }
        romUrl = game.rom;
        // atari800 sniffs the format from the extension; preserve it.
        const m = romUrl.match(/\.[A-Za-z0-9]+$/);
        vfsName = 'game' + (m ? m[0].toLowerCase() : '.atr');
      }

      // Video: stretch the visible TV area to completely fill the canvas so
      // the picture meets all four corners of the CRT-bezel cutout. -stretch
      // full removes the integer-scale letterboxing (which was quantised and
      // viewport-dependent); -fit-screen both + -image-aspect none let it fill
      // without preserving the 4:3 ratio; -horiz-area/-vert-area trim the
      // overscan border down to the TV-safe area.
      let args = ['-stretch', 'full', '-fit-screen', 'both', '-image-aspect', 'none',
                  '-horiz-area', 'tv', '-vert-area', 'tv'];
      if (vfsName) {
        const ext = vfsName.split('.').pop();
        if (ext === 'rom' || ext === 'bin') {
          if (game && game.cartType) {
            args.push('-cart-type', String(game.cartType));
          }
          args.push('-cart', '/' + vfsName);
        } else {
          args.push('/' + vfsName);
        }
      }

      // Machine selection. URL param ?machine= takes precedence over
      // games.json's machine field. Maps user-friendly names to atari800
      // flags: 400/800 -> -atari (OS-B), xl/800xl -> -xl, xe/130xe -> -xe.
      const machineFlags = { 'atari': '-atari', '400': '-atari', '800': '-atari', 'xl': '-xl', '800xl': '-xl', 'xe': '-xe', '130xe': '-xe', 'xegs': '-xegs' };
      const machine = (params.get('machine') || (game && game.machine) || '').toLowerCase();
      if (machine && machineFlags[machine]) args.unshift(machineFlags[machine]);

      // Tab title reflects the actual machine the menu asked for (400 vs 800XL).
      const machineNames = { 'atari': 'Atari 400', '400': 'Atari 400', '800': 'Atari 800', 'xl': 'Atari 800XL', '800xl': 'Atari 800XL', 'xe': 'Atari 130XE', '130xe': 'Atari 130XE', 'xegs': 'Atari XEGS' };
      document.title = machineNames[machine] || 'Atari 800XL';

      window.Module = {
        canvas: document.getElementById('canvas'),
        arguments: args,
        preRun: [function () {
          if (!romUrl || !vfsName) return;
          Module.FS.createPreloadedFile('/', vfsName, romUrl, true, false);
        }],
        print: function (t) { console.log(t); },
        printErr: function (t) { console.warn(t); }
      };

      // Save / load state — DEFERRED through the emulator's frame loop.
      // atari800's StateSav reaches emscripten_sleep (machine reinit) and the
      // wasm runs a blocking ASYNCIFY main loop, so calling it straight from a
      // button (a separate asyncify op) corrupts the stack. Instead JS only
      // sets a request flag (_gx_request_*, no sleep); the fork's gx_state_poll()
      // runs the actual StateSav once per frame on the main-loop stack (safe),
      // and JS polls _gx_state_status() then reads/writes the MEMFS file itself.
      // getState/setState are async; genx-savestate-std.js awaits them.
      var STATE_FILE = '/gx-state.a8s';
      function waitStatus() {
        return new Promise(function (resolve) {
          var n = 0;
          var iv = setInterval(function () {
            var s = Module._gx_state_status();      // 0 busy, 1 ok, -1 fail
            if (s !== 0 || ++n > 300) { clearInterval(iv); resolve(s); }
          }, 16);
        });
      }
      window.GenXStateAdapter = {
        ready: function () { return !!(window.Module && Module.FS && typeof Module._gx_request_save === 'function'); },
        getState: async function () {
          Module._gx_request_save();
          if (await waitStatus() !== 1) throw new Error('save failed');
          return Module.FS.readFile(STATE_FILE);
        },
        setState: async function (bytes) {
          Module.FS.writeFile(STATE_FILE, bytes);
          Module._gx_request_load();
          if (await waitStatus() !== 1) throw new Error('load failed');
        },
        refocus: function () { var c = document.getElementById('canvas'); if (c && c.focus) c.focus(); }
      };

      const s = document.createElement('script');
      s.src = 'atari800.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
