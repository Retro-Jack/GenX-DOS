<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><link rel="shortcut icon" href="../_shared/favicon.ico"><link rel="icon" type="image/gif" href="../_shared/animated_favicon1.gif">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texas Instruments TI-99/4A</title>
  <noscript><div class="gx-noscript">
    <div class="gx-noscript-title">JavaScript Required</div>
    <div>This site is a client-side DOS terminal and emulator suite.</div>
    <div>It needs JavaScript to run.</div>
    <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
  </div></noscript>

  <style>
    /* CRT bezel — shared vintage TV (Sinclair.png, 1362x914, screen hole at
       8.08%/12.14%/65.35%×73.96%) on the 70s wallpaper, same player-in-hole
       recipe as the MSX/CoCo/Spectrum. js99er sizes #canvas via CSS, so we pin
       it into the hole and force it to fill; no barrel/fisheye (the TI picture
       reads better flat). Black .screen-bg behind hides the cutout edge.
       !important on the wallpaper because genx-frame.css loads AFTER. */
    html, body { margin: 0; padding: 0; height: 100%; background: #000 url('../_shared/textures/70s-bg.png') repeat !important; background-size: 220px !important; overflow: hidden; font-family: monospace; color: #ddd; }
    body { display: flex; align-items: center; justify-content: center; }
    .bezel-wrap { position: relative; width: min(100vw, calc((100dvh - 120px) * 1362 / 914)); aspect-ratio: 1362 / 914; }
    .screen-bg { position: absolute; left: 6.6%; top: 10.6%; width: 68.4%; height: 77.0%; background: #000; z-index: 1; }
    #screen { position: absolute; left: 8.08%; top: 12.14%; width: 65.35%; height: 73.96%; overflow: hidden; z-index: 2; }
    #canvas { width: 100% !important; height: 100% !important; display: block; outline: none; border: none; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; transform: translate(8px, 0px) scale(0.9); }
    .bezel-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 14px;
    }
  </style>

  <link rel="stylesheet" href="../_shared/genx-frame.css">
  <link rel="stylesheet" href="../_shared/genx-noscript.css">
  <link rel="stylesheet" href="../_shared/genx-controls-link.css">
  <script defer src="../_shared/genx-controls-link.js"></script>
<script defer src="../_shared/genx-repo-link.js"></script>
  <link rel="stylesheet" href="../_shared/genx-savestate.css">
  <script defer src="../_shared/genx-savestate-std.js"></script>

  <script src="util.js"></script>
  <script src="log.js"></script>
  <script src="lib/jquery-1.11.0.min.js"></script>
  <script src="lib/zip/zip.js"></script>
  <script src="lib/zip/zip-ext.js"></script>
  <script>zip.workerScriptsPath = "lib/zip/";</script>
  <script src="software/system.js"></script>
  <script src="software.js"></script>
  <!-- TI-99/4A components -->
  <script src="emu/tape.js"></script>
  <script src="emu/disk.js"></script>
  <script src="emu/decoder.js"></script>
  <script src="emu/tms9900.js"></script>
  <script src="emu/tms9918a.js"></script>
  <script src="emu/f18a.js"></script>
  <script src="emu/f18agpu.js"></script>
  <script src="emu/f18aflash.js"></script>
  <script src="emu/sn76489.js"></script>
  <script src="emu/tms9919.js"></script>
  <script src="emu/tms5220.js"></script>
  <script src="emu/memory.js"></script>
  <script src="emu/cru.js"></script>
  <script src="emu/keyboard.js"></script>
  <script src="emu/joystick.js"></script>
  <script src="emu/ti994a.js"></script>
  <!-- Main -->
  <script src="sound.js"></script>
  <script src="settings.js"></script>
  <script src="database.js"></script>
</head>
<body id="body">
  <div class="bezel-wrap">
    <div class="screen-bg"></div>
    <div id="screen"><canvas id="canvas" width="304" height="240"></canvas></div>
    <img class="bezel-img" src="../_shared/bezels/Sinclair.png" alt="">
  </div>
  <div id="loading">Loading…</div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var gameKey = params.get('game') || '';

      var settings = new Settings(false);
      settings.setF18AEnabled(false);
      settings.setSoundEnabled(true);

      var canvas = document.getElementById('canvas');
      var ti994a = new TI994A(canvas, {FLOPPY1: new DiskImage("FLOPPY1")}, settings);
      var sound = new Sound(settings.isSoundEnabled(), ti994a.tms9919, ti994a.tms5220);

      // Save / load state — TI994A.getState() returns a JSON-serializable
      // snapshot; restoreState() puts it back. (genx-savestate-std.js wires the
      // bottom-left save/load buttons once `ready` returns true.)
      var _booted = false;
      window.GenXStateAdapter = {
        ready:    function () { return _booted; },
        getState: function () { return ti994a.getState(); },
        setState: function (s) { ti994a.restoreState(s); },
        refocus:  function () { canvas.focus(); }
      };

      var loadingEl = document.getElementById('loading');
      function hideLoading() { if (loadingEl) loadingEl.style.display = 'none'; }

      function startBoot() {
        hideLoading();
        ti994a.start();
        _booted = true;
        // grab keyboard focus
        canvas.tabIndex = 0;
        canvas.focus();
      }

      if (!gameKey) {
        // No cart — boot straight to the TI title / BASIC selection screen
        startBoot();
        return;
      }

      // Cart by key — first try .rpk, fall back to .bin
      var software = new Software();
      var rpkUrl = 'carts/' + gameKey + '.rpk';
      var binUrl = 'carts/' + gameKey + '.bin';

      function loadBin() {
        software.loadBinModuleFromURL(binUrl, function (cart) {
          if (cart) ti994a.loadSoftware(cart);
          startBoot();
        }, function () {
          // Neither format found — boot to BASIC
          startBoot();
        });
      }

      software.loadRPKModuleFromURL(rpkUrl, function (cart) {
        if (cart) {
          ti994a.loadSoftware(cart);
          startBoot();
        } else {
          loadBin();
        }
      }, function () {
        loadBin();
      });

      // Click anywhere on the page to re-focus the canvas (keyboard input)
      document.addEventListener('click', function () { canvas.focus(); });
    })();
  </script>
</body>
</html>
