    <title>Tandy CoCo</title>
    <style>
      /* CRT bezel — shared vintage TV (TV-Vintage.png, 1362x914) on the 70s
       wallpaper, same player-in-hole recipe as the Spectrum/MSX. The hole is
       at 7.636%/11.488%/66.3%×75.383%, flood-filled out of the PNG's alpha
       channel rather than eyeballed, so the canvas meets the aperture corner
       to corner; the tube's rounded corners trim a few pixels of overscan,
       which is what a real one did. XRoar (SDL2) sizes #canvas itself, so we
       pin it into the hole and force it to fill; no barrel/fisheye (the CoCo
       picture reads better flat). Black .screen-bg behind hides the cutout
       edge. !important on the wallpaper because genx-frame.css loads AFTER. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000 url('../_shared/textures/70s-bg.png') repeat !important;
        background-size: 220px !important;
        overflow: hidden;
        color: #fff;
        font-family: monospace;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bezel-wrap {
        position: relative;
        width: min(100vw, calc((100dvh - 120px) * 1362 / 914));
        aspect-ratio: 1362 / 914;
      }
      .screen-bg {
        position: absolute;
        left: 6.3%;
        top: 9.5%;
        width: 69%;
        height: 79.5%;
        background: #000;
        z-index: 1;
      }
      #screen {
        position: absolute;
        left: 6.975%;
        top: 10.503%;
        width: 67.621%;
        height: 77.352%;
        overflow: hidden;
        z-index: 2;
      }
      #canvas {
        /* Oversized on purpose, and clipped by #screen's overflow. Two things
           are being worked around at once. XRoar fits its picture to the canvas
           by width, and its frame's aspect measures about 1.370 rather than the
           4:3 its documented picture areas imply, so a canvas matching the
           opening always keeps a black band top and bottom -- about 9px and
           3px, since it does not centre the fit either. And the bezel's cutout
           carries a 9px feathered edge: #screen reaches the OUTER edge of that
           ramp, so the picture sits behind the whole of it and the ink blends
           into the picture rather than into whatever is behind. Clip to the
           inner edge instead and the ramp blends with .screen-bg, which draws a
           faint halo -- invisible while that is black, and glaring if it is not.
           The canvas is 8.1% wider than the clip box, which puts the painted
           picture 10px proud of it all round and drops the bands outside, at a
           cost of 3.8% of the frame per side -- screen border, not picture.
           Percentages throughout, so it holds at every window size. */
        position: absolute;
        left: -4.071%;
        top: -2.9%;
        width: 108.142% !important;
        height: 104.809% !important;
        display: block;
        image-rendering: pixelated;
        outline: none;
      }
      .bezel-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 3;
      }
      .err {
        padding: 20px;
      }
    </style>
    <link rel="stylesheet" href="../_shared/styles/genx-frame.css" />
  </head>
  <body>
    <noscript
      ><div class="gx-noscript">
        <div class="gx-noscript-title">JavaScript Required</div>
        <div>This site is a client-side DOS terminal and emulator suite.</div>
        <div>It needs JavaScript to run.</div>
        <div class="gx-noscript-hint">Enable JavaScript and reload.</div>
      </div></noscript
    >
    <div class="bezel-wrap">
      <div class="screen-bg"></div>
      <div id="screen">
        <canvas
          id="canvas"
          tabindex="0"
          oncontextmenu="event.preventDefault()"
        ></canvas>
      </div>
      <img class="bezel-img" src="../_shared/bezels/TV-Vintage.png" alt="" />
    </div>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        arguments: [
          '-no-vo-colour-killer',
          '-no-disk-auto-os9',
          '-ao-fragments',
          '3',
          '-machine',
          'coco',
        ],
        // XRoar requests system ROMs via absolute paths like '/d64_1.rom'; strip
        // the leading slash so they resolve relative to this directory.
        locateFile: function (path) {
          return path.replace(/^\/+/, '');
        },
      };
      var pendingGame = null;

      // Stub callbacks XRoar's WASM invokes for UI updates we don't render.
      // XRoar calls this once it has finished initialising. Upstream's own
      // online build hooks the gamepad here, and it has to be done this way
      // round: XRoar enumerates joysticks at startup, the browser hides pads
      // until a button is pressed on one, and that permission is per document
      // — so there is never a pad present when SDL looks, and its log says
      // "no devices found" even with one plugged in. Nothing re-scans, so a
      // pad attached later is invisible for the life of the page.
      //
      // The fix is to tell XRoar directly when the browser announces a pad.
      // Note this build's API is not the one the Color Computer Archive's
      // older build uses: 'wasm_set_joystick' does not exist here, and calling
      // it silently does nothing.
      // XRoar works out its picture rectangle once, from the canvas size it
      // happens to see at startup, and never recomputes it. Everything after
      // that -- our CSS box, a window resize, going fullscreen -- moves the
      // backing store without telling the engine, so the picture stays the size
      // it was first laid out at and the shortfall shows up as black bands
      // inside the canvas that look for all the world like a bezel misfit. They
      // are not: nothing about the aperture or the CSS can shift them, because
      // the emulator is drawing a smaller rectangle than it has been given.
      // wasm_resize is how upstream's own online build keeps the two in step,
      // and it is the only thing that closes the gap.
      function gxSyncCanvasSize() {
        var c = document.getElementById('canvas');
        if (!c) return;
        var r = c.getBoundingClientRect();
        var w = Math.max(1, Math.round(r.width));
        var h = Math.max(1, Math.round(r.height));
        if (c.width !== w || c.height !== h) {
          c.width = w;
          c.height = h;
        }
        if (typeof Module !== 'undefined' && Module._wasm_resize) {
          try {
            Module._wasm_resize(w, h);
          } catch (e) {
            /* older build without the export; picture just stays as laid out */
          }
        }
      }

      var gxResizeQueued = false;
      window.addEventListener('resize', function () {
        if (gxResizeQueued) return;
        gxResizeQueued = true;
        requestAnimationFrame(function () {
          gxResizeQueued = false;
          gxSyncCanvasSize();
        });
      });

      function ui_done_initialising() {
        // Once is not enough: this fires before XRoar has finished settling its
        // own video geometry, so a single call here gets overwritten and the
        // bands come back on a cold load. Re-assert it over the first couple of
        // seconds so ours is the last word, whenever the engine stops moving.
        gxSyncCanvasSize();
        requestAnimationFrame(gxSyncCanvasSize);
        [100, 400, 1000, 2000].forEach(function (ms) {
          setTimeout(gxSyncCanvasSize, ms);
        });
        window.addEventListener('gamepadconnected', function (e) {
          try {
            Module.ccall(
              'wasm_gamepad_connected',
              null,
              ['number'],
              [e.gamepad.index],
            );
          } catch (err) {
            /* older build without the export */
          }
          // Hand the pad to a joystick port. XRoar lists THREE entries per
          // pad — a bare "0: Standard Gamepad" plus "(L)" and "(R)" — and in
          // testing all three gave left-stick movement with A to fire; none
          // is a d-pad. The picker below takes whichever it finds, by the name
          // XRoar reports rather than a guessed one.
          gxStartPad(e.gamepad.index);
        });

        window.addEventListener('gamepaddisconnected', function (e) {
          try {
            Module.ccall(
              'wasm_gamepad_disconnected',
              null,
              ['number'],
              [e.gamepad.index],
            );
          } catch (err) {
            /* nothing to undo */
          }
        });
      }
      // XRoar drives its UI through these callbacks, passing string POINTERS
      // that need UTF8ToString(). This page has no menus, so most stay stubs —
      // but the joystick menu is the only place XRoar names a connected
      // gamepad, and we need that name to plug it into a port. So capture it.
      // Brief on-screen note when a pad attaches — the same courtesy XRoar's
      // own online build shows, and the only feedback a player gets that the
      // pad took, since there is no joystick menu on this page.
      function gxToast(msg) {
        var d = document.createElement('div');
        d.textContent = msg;
        d.style.cssText =
          'position:fixed;left:50%;bottom:58px;transform:translateX(-50%);' +
          'z-index:100;background:#000;color:rgba(255,176,0,0.85);' +
          'border:1px solid rgba(255,176,0,0.35);border-radius:4px;' +
          'font:12px/1 ui-monospace,Menlo,Consolas,monospace;padding:6px 12px;';
        document.body.appendChild(d);
        setTimeout(function () {
          d.remove();
        }, 4000);
      }

      var gxJoyMenu = [];
      function gxStr(p) {
        try {
          return typeof UTF8ToString === 'function'
            ? UTF8ToString(p)
            : String(p);
        } catch (e) {
          return String(p);
        }
      }
      function ui_menu_clear(menu) {
        if (gxStr(menu) === 'left-joystick') gxJoyMenu = [];
      }
      function ui_menu_add(menu, label, value) {
        if (gxStr(menu) === 'left-joystick')
          gxJoyMenu.push({ label: gxStr(label), value: value });
      }
      function ui_menu_add_str(menu, label, value) {
        if (gxStr(menu) === 'left-joystick')
          gxJoyMenu.push({ label: gxStr(label), value: gxStr(value) });
      }

      function ui_menu_select() {}
      function ui_menu_select_str() {}
      function ui_set_checkbox() {}
      function ui_set_fullscreen() {}
      function ui_set_html() {}
      function ui_set_value() {}
      function ui_update_ccr() {}
      function ui_update_disk_info() {}
      function ui_update_hd_filename() {}
      function ui_update_tape_input_filename() {}
      function ui_update_tape_playing() {}

      // XRoar's SDL layer sets the window title once it starts, which puts the
      // engine's name in the browser tab — the tab is supposed to read the
      // machine, never the emulator. Put it back whenever that happens.
      (function () {
        var WANT = 'Tandy CoCo';
        var t = document.querySelector('title');
        if (!t) return;
        new MutationObserver(function () {
          if (document.title !== WANT) document.title = WANT;
        }).observe(t, { childList: true });
      })();

      Module.onRuntimeInitialized = function () {
        const wasm_load_file = Module.cwrap('wasm_load_file', null, [
          'string',
          'number',
          'number',
        ]);
        const game = pendingGame || { machine: 'coco' };
        Module.ccall(
          'wasm_set_machine_cart',
          null,
          ['string', 'string', 'string', 'string'],
          [
            game.machine || 'coco',
            game.cart || null,
            game.cart_rom || null,
            game.cart_rom2 || null,
          ],
        );
        if (game.autorun) {
          const ext = game.autorun.split('.').pop().toLowerCase();
          const delay = ext === 'bin' ? 0 : 2000;
          setTimeout(() => wasm_load_file(game.autorun, 1 /* run */, 0), delay);
        }
      };

      // Feed XRoar's WASM virtual joystick from the pad, once per frame.
      //
      // Axis values are 16-bit unsigned: 0 hard one way, 65535 the other,
      // 32768 centred. The d-pad wins when pressed, otherwise the left stick
      // is passed through, so either works without a setting.
      //
      // All four face buttons fire, which is the house convention for
      // single-action games — the player should not have to find the one
      // button that works.
      var gxPadTries = 0;
      function gxStartPad(index) {
        var port = pendingGame && pendingGame.joyport === 'right' ? 0 : 1;

        // Pick from the list XRoar actually reports rather than guessing a
        // name — 'joy-wasm-virtual' looked like one in the binary and is not.
        // Preference order:
        //   1. the virtual joystick, which the d-pad poll below can drive;
        //   2. the pad's left-stick profile;
        //   3. whatever pad entry exists.
        // Anything found beats nothing, so a miss degrades to the stick rather
        // than to a dead pad.
        var pick = null;
        var byLabel = function (re) {
          return gxJoyMenu.filter(function (o) {
            return re.test(o.label);
          })[0];
        };
        // Prefer the plain "0: Standard Gamepad" entry — no (L)/(R) suffix.
        // XRoar lists three per pad: the bare one, which on SDL's standard
        // mapping is the d-pad and face buttons, then one for each analogue
        // stick. The d-pad is the right default for these games, and it keeps
        // movement and fire well apart on the pad.
        pick =
          gxJoyMenu.filter(function (o) {
            return (
              /gamepad|joystick/i.test(o.label) &&
              !/\(L\)|\(R\)|keyboard|mouse|none/i.test(o.label)
            );
          })[0] ||
          byLabel(/gamepad.*\(L\)|joystick.*\(L\)/i) ||
          gxJoyMenu
            .filter(function (o) {
              return (
                /gamepad|joystick/i.test(o.label) &&
                !/keyboard|mouse|none/i.test(o.label)
              );
            })
            .pop();

        if (!pick) {
          // XRoar rebuilds its joystick menu in response to
          // wasm_gamepad_connected, but not synchronously — read it too soon
          // and the pad simply is not in the list yet. Wait for it rather than
          // giving up on the first look.
          if (gxPadTries++ < 20) {
            setTimeout(function () {
              gxStartPad(index);
            }, 100);
            return;
          }
          gxToast('Gamepad seen, but no joystick entry to bind');
          return;
        }
        gxPadTries = 0;
        try {
          if (typeof pick.value === 'string') {
            // 'joyport' is the port as THIS STACK numbers it, which does not
            // reliably match the port a game's manual names. Polaris's manual
            // says "the right joystick is for one player"; setting it to right
            // here gives a pad that does nothing, and left is what actually
            // works. Set this field from testing, not from the documentation.
            Module.ccall(
              'wasm_set_joystick_by_name',
              null,
              ['number', 'string'],
              [port, pick.value],
            );
          } else {
            Module.ccall(
              'wasm_set_joystick_port',
              null,
              ['number', 'number'],
              [port, pick.value],
            );
          }
        } catch (err) {
          gxToast('Gamepad bind failed');
          return;
        }
        gxToast('Pad \u2192 ' + pick.label);
      }

      function resumeAudio() {
        if (
          typeof Module === 'undefined' ||
          typeof Module.SDL2 === 'undefined' ||
          typeof Module.SDL2.audioContext === 'undefined'
        )
          return;
        if (Module.SDL2.audioContext.state === 'suspended')
          Module.SDL2.audioContext.resume();
      }
      document.getElementById('canvas').addEventListener('click', resumeAudio);
      document.addEventListener('keydown', resumeAudio);

      (async function () {
        const params = new URLSearchParams(location.search);
        const key = params.get('game');
        if (key) {
          let games;
          try {
            games = await (await fetch('games.json')).json();
          } catch (e) {
            const d = document.createElement('div');
            d.className = 'err';
            d.textContent = 'Failed to load games.json: ' + e.message;
            document.body.replaceChildren(d);
            return;
          }
          const game = games[key];
          if (!game) {
            const d = document.createElement('div');
            d.className = 'err';
            d.textContent = 'Unknown game key: ' + key;
            document.body.replaceChildren(d);
            return;
          }
          document.title = 'Tandy CoCo';
          // Composite artifact colour, per game. On a real CoCo the hi-res
          // two-colour modes were never really two-colour: NTSC composite turns
          // alternating pixel columns into red and blue, and games were drawn
          // FOR that — Demon Attack is black, white, red and blue on a TV set,
          // and stark monochrome without it. XRoar models this with -tv-input;
          // 'cmp-rb' and 'cmp-br' are the two artifact phases, which decide
          // which colour lands on which pixel column.
          //
          // Per game rather than global: it only means anything for titles that
          // relied on it, and the phase differs between them. Must be pushed
          // before xroar.js loads, since these are argv.
          if (game.tv) Module.arguments.push('-tv-input', game.tv);
          // Joystick, per game. Many CoCo titles are joystick-only — Galactic
          // Attack says "PRESS FIRE BUTTON TO BEGIN" and ignores the keyboard
          // entirely — so without this they cannot be started at all.
          //
          // XRoar has its own joystick support, which is the right thing to use
          // rather than faking key presses: a physical pad is picked up natively
          // through SDL, and 'kjoy0' is XRoar's keyboard joystick (cursor keys
          // plus Alt and the Windows key for the two buttons) for players
          // without one. Named per game because a keyboard joystick swallows the
          // cursor keys, which some of these games read directly.
          //
          // 'joy' names the profile, 'joyport' picks which of the CoCo's two
          // ports it plugs into — right is the one games normally expect.
          if (game.joy) {
            // Only a game that reads a joystick has anything to say about
            // pads. Set the flag AND call it, because the order is not
            // guaranteed: the notice script is deferred, while this code
            // resumes after a fetch that may already be cached. Whichever of
            // the two runs second is the one that shows the notice. A bare
            // "call it if it exists" check silently did nothing when the fetch
            // won the race, which is exactly how this was missed the first time.
            window.GENX_PAD_RELEVANT = true;
            if (window.GenXPadNotice) window.GenXPadNotice();
            // XRoar's own keyboard joystick: cursor keys to steer, Alt to
            // fire. Defining a custom profile was tried and abandoned — the
            // -joy-axis/-joy-button options did not attach to a profile named
            // on the command line (the console reported the port bound to an
            // empty profile while the virtual joystick kept its defaults), so
            // the built-in one is what actually works.
            //
            // 'left' is the port these games expect, which is not the guess:
            // -joy-right left Galactic Attack sitting on its title screen, and
            // -joy-left started it immediately.
            Module.arguments.push(
              game.joyport === 'left' ? '-joy-left' : '-joy-right',
              game.joy,
            );
          }
          pendingGame = game;
        } else {
          document.title = 'Tandy CoCo';
        }
        const s = document.createElement('script');
        s.src = 'xroar.js';
        document.body.appendChild(s);
      })();
    </script>

    <link rel="stylesheet" href="../_shared/styles/genx-controls-link.css" />

    <script defer src="../_shared/genx-repo-link.js"></script>

    <!-- save / load state: XRoar exports write_snapshot (full-machine .sna to the
       WASM FS); we read those bytes back as the state, and restore by writing
       them to the FS and reloading via wasm_load_file (same path used to load
       games). -->
    <link rel="stylesheet" href="../_shared/styles/genx-savestate.css" />
    <script>
      (function () {
        var SNAP = '/gx-state.sna';
        function M() {
          return window.Module;
        }
        window.GenXStateAdapter = {
          ready: function () {
            var m = M();
            return !!(
              m &&
              m.FS &&
              m.cwrap &&
              typeof m._write_snapshot === 'function'
            );
          },
          getState: function () {
            var m = M();
            if (!m._gxWrite)
              m._gxWrite = m.cwrap('write_snapshot', 'number', ['string']);
            try {
              m.FS.unlink(SNAP);
            } catch (e) {}
            m._gxWrite(SNAP);
            return m.FS.readFile(SNAP); // Uint8Array — the .sna machine snapshot
          },
          setState: function (bytes) {
            var m = M();
            if (!m._gxLoad)
              m._gxLoad = m.cwrap('wasm_load_file', null, [
                'string',
                'number',
                'number',
              ]);
            try {
              m.FS.unlink(SNAP);
            } catch (e) {}
            m.FS.writeFile(SNAP, bytes);
            m._gxLoad(SNAP, 0, 0); // load the snapshot → restores machine state
          },
          refocus: function () {
            var c = document.getElementById('canvas');
            if (c && c.focus) c.focus();
          },
        };
      })();
    </script>
    <script defer src="../_shared/genx-savestate-std.js"></script>
    <script defer src="../_shared/genx-savestate-transfer.js"></script>
  </body>
