        html, body {
            margin: 0;
            background: #000 url('../systems/_shared/textures/70s-bg.png') repeat;
            background-size: 220px;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bezel + cutout layout — three explicit layers, back to front:
           1. .screen-bg — black backdrop, slightly bigger than the cutout
              so the wallpaper can't bleed through the PNG's anti-aliased
              cutout boundary.
           2. .prompt-fit — the canvas/prompt area, sized to the cutout.
           3. .bezel-img — PC.png on top; its transparent cutout reveals
              the prompt underneath. PC.png is 1815x1300 (aspect 1.396);
              cutout at left 13.5%, top 15.7%, w 63.25%, h 64.5%. */
        .bezel-wrap {
            position: relative;
            width: min(100vw, calc(100vh * 1815 / 1300));
            aspect-ratio: 1815 / 1300;
        }
        .screen-bg {
            position: absolute;
            inset: 5%;
            background: #000;
            z-index: 1;
        }
        .prompt-fit {
            position: absolute;
            left: 15.1%;
            top: 17.3%;
            width: 60.1%;
            height: 61.3%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
        }
        .bezel-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 3;
        }

        /* The prompt is a fixed 80×25 character grid (960×300 at native 12px).
           CSS transform: scale fits it to the cutout via JS on load+resize. */
        .prompt {
            width: 960px;
            height: 300px;
            background-color: #000;
            overflow: hidden;
            transform-origin: center center;
            flex-shrink: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .font {
            background: url(../systems/_shared/styles/VGA_font/f12.7.png) no-repeat 0px 0px;
            width: 12px;
            height: 12px;
            float: left;
            overflow: hidden;
            /* Pixel font — sample nearest-neighbour, not bilinear. Without this
               Firefox bleeds the neighbouring sprite-sheet cell along each
               glyph's clip edge under the non-integer transform: scale,
               drawing a hairline across every text row. */
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Mobile-device block — see systems/_shared/styles/genx-noscript.css for the canonical copy. */
        @media (pointer: coarse), (hover: none) {
            body::before {
                content: "Desktop Only\00000a\00000aGenX-DOS is a keyboard-driven DOS terminal\00000aand 8-bit emulator suite.\00000a\00000aPlease visit on a desktop with a keyboard.";

                line-height: 1.6;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 20px;
            }
        }
    </style>

    <script>
        // Fit the 960×300 prompt grid into the bezel's screen cutout via
        // CSS transform. Non-uniform scale stretches the grid to fill the
        // cutout in both axes — period-accurate, since real VGA text mode
        // used non-square pixels (720×400 in 9×16 cells, aspect ~1.8).
        function fitPrompt() {
            var wrap = document.querySelector('.prompt-fit');
            var prompt = document.getElementById('prompt');
            if (!wrap || !prompt) return;
            var sx = wrap.clientWidth / 960;
            var sy = wrap.clientHeight / 300;
            // Snap each 12px cell to a whole number of device pixels so row
            // and column boundaries land on real pixels — otherwise Firefox
            // antialiases the sub-pixel clip edge of every glyph div into a
            // hairline on every text row. Floor so the grid never overflows
            // the cutout; .prompt-fit's black fill covers the small slack.
            var dpr = window.devicePixelRatio || 1;
            sx = Math.max(1, Math.floor(12 * sx * dpr)) / (12 * dpr);
            sy = Math.max(1, Math.floor(12 * sy * dpr)) / (12 * dpr);
            prompt.style.transform = 'scale(' + sx + ',' + sy + ')';
        }

        // Auto-scroll the prompt to its bottom so newly-rendered rows are
        // always in view. Mimics VGA's roll-up behaviour: the buffer keeps
        // growing in the DOM, but only the last 25 rows are visible.
        function scrollPromptToBottom() {
            var prompt = document.getElementById('prompt');
            if (!prompt) return;
            prompt.scrollTop = prompt.scrollHeight;
        }

        // Hook every DOM change on #prompt and roll to the bottom on the
        // next animation frame so the cursor stays in view as rows append.
        function installAutoScroll() {
            var prompt = document.getElementById('prompt');
            if (!prompt || !window.MutationObserver) return;
            var queued = false;
            var observer = new MutationObserver(function () {
                if (queued) return;
                queued = true;
                requestAnimationFrame(function () {
                    scrollPromptToBottom();
                    queued = false;
                });
            });
            observer.observe(prompt, { childList: true });
        }

        window.addEventListener('resize', fitPrompt);
    </script>
